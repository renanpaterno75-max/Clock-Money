<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock-Money • Lovable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0d0d0e;overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.neon{color:#7bf1a8;text-shadow:0 0 10px rgba(123,241,168,0.8),0 0 30px rgba(123,241,168,0.4),0 0 60px rgba(123,241,168,0.2)}
.clock-wall{
  width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #1a1a1a 0%, #080808 60%, #000 100%);
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 0 0 12px #0a0a0a, 0 0 0 13px rgba(255,255,255,0.04), 0 30px 80px rgba(0,0,0,0.9), inset 0 0 50px rgba(0,0,0,1);
}
@media(max-width:400px){.clock-wall{width:300px;height:300px}}
.glass{backdrop-filter:blur(24px);background:rgba(18,18,18,0.72);border:1px solid rgba(255,255,255,0.08)}
.lamp-glow{position:absolute;right:-100px;top:40%;width:600px;height:600px;background:radial-gradient(circle, rgba(255,180,80,0.18) 0%, rgba(255,140,40,0.06) 30%, transparent 70%);pointer-events:none;filter:blur(10px)}
</style>
</head>
<body class="min-h-screen relative flex flex-col">

<!-- CENÁRIO QUARTO -->
<div class="absolute inset-0">
  <div class="absolute inset-0 bg-[#11110f]"></div>
  <div class="absolute inset-0 bg-gradient-to-b from-[#1a1a18]/50 to-[#0a0a09]"></div>
  <!-- Parede -->
  <div class="absolute top-0 left-0 right-0 h-[65%] bg-[#171612]"></div>
  <!-- Luz abajur -->
  <div class="lamp-glow"></div>
  <!-- Cama sugerida embaixo -->
  <div class="absolute bottom-0 left-0 right-0 h-[45%] bg-gradient-to-t from-[#1f1a14] via-[#221c14]/60 to-transparent opacity-80"></div>
  <div class="absolute bottom-[12%] left-1/2 -translate-x-1/2 w-[90%] max-w-[700px] h-[180px] bg-[#2a2218]/40 blur-[1px] rounded-t-[80px]"></div>
</div>

<!-- CONTEÚDO -->
<div class="relative z-10 flex-1 flex flex-col items-center pt-[8vh] pb-6 px-4">

  <!-- ABAS (top) -->
  <div id="abas" class="flex gap-2 mb-6 overflow-auto max-w-full"></div>

  <!-- RELÓGIO REDONDO NA PAREDE -->
  <div class="clock-wall flex flex-col items-center justify-center relative">
    <div class="text-[9px] tracking-[0.4em] opacity-30 mb-2">CLOCKMONEY</div>
    <div id="valorGrande" class="mono text-[38px] md:text-[44px] font-bold neon tracking-tighter">R$ 0,00</div>
    <div id="subInfo" class="text-center mt-3 leading-[1.1]">
      <div id="hojeTxt" class="text-[11px] mono text-white/40">Hoje: R$ 0,00</div>
      <div id="segTxt" class="text-[11px] mono text-emerald-300/50 mt-1">Por seg: R$ 0,0000</div>
    </div>
    <!-- reflexo -->
    <div class="absolute top-[12%] left-[18%] w-[35%] h-[18%] bg-white/[0.06] rounded-full blur-[12px] rotate-[-20deg] pointer-events-none"></div>
  </div>

  <!-- CARD ACUMULADO -->
  <div class="mt-auto w-full max-w-[420px] glass rounded-[20px] p-5">
    <div class="text-[10px] tracking-[0.2em] opacity-40">ACUMULADO DE HOJE</div>
    <div id="acumuladoHoje" class="mono text-[28px] font-bold neon mt-1">R$ 0,00</div>
    <div id="acumuladoSub" class="text-[11px] mono text-white/50 mt-1">O ativo(s) • R$ 0,0000 por segundo</div>
  </div>

  <!-- BOTÕES -->
  <div class="mt-4 flex gap-3">
    <button onclick="toggleModal()" class="glass px-5 py-3 rounded-full text-sm font-semibold flex gap-2 items-center"><span>◧</span> Editar carteira</button>
    <button onclick="togglePause()" id="btnPause" class="glass px-5 py-3 rounded-full text-sm font-semibold">⏸ Pausar</button>
    <button onclick="resetHoje()" class="w-11 h-11 glass rounded-full flex items-center justify-center">↺</button>
  </div>
</div>

<!-- MODAL CARTEIRA (desliza) -->
<div id="modal" class="fixed inset-0 z-50 translate-y-full transition-transform duration-500">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-xl" onclick="toggleModal()"></div>
  <div class="absolute bottom-0 left-0 right-0 bg-[#121212] rounded-t-[32px] max-h-[85vh] overflow-auto border-t border-white/10 p-6">
    <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-6"></div>
    <div class="flex justify-between items-center">
      <h2 class="font-bold text-lg">Sua Carteira</h2>
      <button onclick="novaAba()" class="text-xs bg-white text-black px-3 py-1.5 rounded-full font-bold">+ Nova aba</button>
    </div>
    <div id="abasModal" class="flex gap-2 mt-4 overflow-auto"></div>

    <div class="flex gap-2 mt-6">
      <button onclick="setTipo('B3')" id="mBtnB3" class="flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm">B3 • Ações / FIIs</button>
      <button onclick="setTipo('FIXA')" id="mBtnFIXA" class="flex-1 py-3 rounded-xl bg-zinc-800 text-sm">CDI / Poupança</button>
    </div>

    <div id="mFormB3" class="mt-5">
      <input id="busca" class="w-full bg-black border border-white/10 rounded-2xl p-4 outline-none" placeholder="MXRF11, HGLG11, WEGE3..." oninput="buscar(this.value)" onfocus="buscar(this.value)">
      <div id="sugestoes" class="bg-zinc-800 rounded-xl mt-2 hidden border border-white/10 overflow-hidden"></div>
      <div id="ativoInfo" class="hidden mt-3 bg-white/5 p-3 rounded-xl text-sm flex justify-between"><span id="ativoNome" class="font-bold"></span><span id="ativoPreco" class="text-emerald-400 mono"></span></div>
      <div class="grid grid-cols-2 gap-3 mt-4">
        <div><div class="text-[10px] opacity-50">QTD</div><input id="qtd" type="number" class="w-full bg-black border border-white/10 rounded-xl p-3 font-bold" placeholder="0" oninput="onQtdChange()"></div>
        <div><div class="text-[10px] opacity-50">TOTAL R$</div><input id="total" type="number" class="w-full bg-black border border-emerald-500/30 rounded-xl p-3 font-bold text-emerald-400" placeholder="0,00" oninput="onTotalChange()"></div>
      </div>
    </div>

    <div id="mFormFIXA" class="hidden mt-5 space-y-3">
      <select id="tipoFixa" class="w-full bg-black border border-white/10 rounded-xl p-4" onchange="trocaFixa()">
        <option value="CDI_100">Nubank 100% CDI • 12,15% a.a.</option><option value="CDI_120">CDB 120% CDI • 14,58%</option><option value="CDI_110">CDB 110% CDI • 13,36%</option><option value="POUP">Poupança • 7,5%</option><option value="SELIC">Selic • 11,75%</option><option value="CUSTOM">Personalizado</option>
      </select>
      <input id="nomeFixa" class="w-full bg-black border border-white/10 rounded-xl p-4" placeholder="Nome: Reserva Nubank">
      <div class="grid grid-cols-2 gap-3"><input id="taxaFixa" type="number" class="bg-black border border-white/10 rounded-xl p-4 mono" placeholder="% a.a."><input id="valorFixa" type="number" class="bg-black border border-white/10 rounded-xl p-4 mono" placeholder="Valor R$"></div>
    </div>

    <div id="preview" class="mono text-xs bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl mt-4 hidden"></div>
    <button onclick="adicionar()" class="w-full bg-white text-black font-bold rounded-2xl p-4 mt-4">+ Adicionar nesta carteira</button>
    <div id="lista" class="mt-6 space-y-2 pb-10"></div>
  </div>
</div>

<script>
const TOKEN="qtZQumqzTgLyLYyMd5Ph9n";const POPULARES=["MXRF11","HGLG11","KNRI11","XPLG11","BCFF11","PETR4","VALE3","WEGE3","ITUB4"];const TAXAS={CDI_100:12.15,CDI_120:14.58,CDI_110:13.36,POUP:7.5,SELIC:11.75};
let carteiras=JSON.parse(localStorage.getItem('carteirasV24')||'null')||[{id:1,nome:'FIIs',ativos:[]},{id:2,nome:'Ações',ativos:[]},{id:3,nome:'Reserva',ativos:[]}];
let ativaId=parseInt(localStorage.getItem('ativaId')||'1');let sel=null,tipoAtivo='B3',trava=false,inicio=new Date();inicio.setHours(0,0,0,0);let pausado=false;
function save(){localStorage.setItem('carteirasV24',JSON.stringify(carteiras));localStorage.setItem('ativaId',ativaId);}
function renderAbas(){const html=carteiras.map(c=>`<button onclick="trocaAba(${c.id})" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap ${c.id===ativaId?'bg-white text-black':'glass'}">${c.nome}</button>`).join('');document.getElementById('abas').innerHTML=html;document.getElementById('abasModal').innerHTML=html;}
function trocaAba(id){ativaId=id;save();renderAbas();renderLista();}function novaAba(){const nome=prompt('Nome da carteira:');if(!nome) return;const id=Date.now();carteiras.push({id,nome,ativos:[]});ativaId=id;save();renderAbas();renderLista();}
function setTipo(t){tipoAtivo=t;document.getElementById('mBtnB3').className=t==='B3'?'flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm':'flex-1 py-3 rounded-xl bg-zinc-800 text-sm';document.getElementById('mBtnFIXA').className=t==='FIXA'?'flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm':'flex-1 py-3 rounded-xl bg-zinc-800 text-sm';document.getElementById('mFormB3').classList.toggle('hidden',t!=='B3');document.getElementById('mFormFIXA').classList.toggle('hidden',t!=='FIXA');}
function trocaFixa(){const tipo=document.getElementById('tipoFixa').value;if(TAXAS[tipo])document.getElementById('taxaFixa').value=TAXAS[tipo];}
function buscar(q){const d=document.getElementById('sugestoes');const termo=(q||'').toUpperCase();let lista=POPULARES.filter(t=>t.includes(termo)).slice(0,6);if(termo.length===0)lista=POPULARES.slice(0,5);if(lista.length===0)lista=[termo];d.innerHTML=lista.map(t=>`<div class="p-3 hover:bg-white/10 cursor-pointer" onclick="selecionar('${t}')">${t}</div>`).join('');d.classList.remove('hidden');}
async function getDadosBrapi(t){try{const r=await fetch(`https://brapi.dev/api/quote/${t}?token=${TOKEN}&dividends=true`);const j=await r.json();return j.results?.[0]||null;}catch(e){return null;}}
async function selecionar(t){document.getElementById('busca').value=t;document.getElementById('sugestoes').classList.add('hidden');const prev=document.getElementById('preview');prev.classList.remove('hidden');prev.innerHTML=`Buscando ${t}...`;const dados=await getDadosBrapi(t);let preco=dados?.regularMarketPrice||(t.includes('11')?10.25:42.6);let dy=t.includes('11')?0.12:0.06;let dyTxt=t.includes('11')?'12% FII':'6% estimado';if(dados?.dividendsData?.cashDividends?.length){const data12m=new Date();data12m.setFullYear(data12m.getFullYear()-1);const soma=dados.dividendsData.cashDividends.filter(d=>new Date(d.paymentDate)>data12m).reduce((a,b)=>a+(b.rate||0),0);if(soma>0){dy=soma/preco;dyTxt=`${(dy*100).toFixed(2)}% a.a.`;}}sel={ticker:t,preco,dy,dyTxt,rendDia:preco*dy/365};document.getElementById('ativoInfo').classList.remove('hidden');document.getElementById('ativoNome').innerText=t;document.getElementById('ativoPreco').innerText=`R$ ${preco.toFixed(2)} • ${dyTxt}`;prev.innerHTML=`${t} • R$ ${preco.toFixed(2)} • ${dyTxt}`;}
function onQtdChange(){if(trava||!sel) return;trava=true;const qtd=parseFloat(document.getElementById('qtd').value)||0;document.getElementById('total').value=qtd>0?(qtd*sel.preco).toFixed(2):'';trava=false;updatePreview();}
function onTotalChange(){if(trava||!sel) return;trava=true;const total=parseFloat(document.getElementById('total').value)||0;document.getElementById('qtd').value=total>0?Math.floor(total/sel.preco):'';trava=false;updatePreview();}
function updatePreview(){if(!sel) return;const qtd=parseInt(document.getElementById('qtd').value)||0;const prev=document.getElementById('preview');if(qtd>0){prev.classList.remove('hidden');const td=(sel.preco*sel.dy/365)*qtd;prev.innerHTML=`${qtd} cotas = R$ ${(qtd*sel.preco).toFixed(2)} • R$ ${td.toFixed(2)}/dia`;}}
function adicionar(){const cart=carteiras.find(c=>c.id===ativaId);if(tipoAtivo==='B3'){const qtd=parseInt(document.getElementById('qtd').value)||0;if(!sel||qtd<=0) return alert('Selecione ativo e QTD');cart.ativos.push({id:Date.now(),tipo:'B3',ticker:sel.ticker,qtd,preco:sel.preco,dy:sel.dy,dyTxt:sel.dyTxt,rendDia:(sel.preco*sel.dy/365)*qtd});}else{const nome=document.getElementById('nomeFixa').value||document.getElementById('tipoFixa').selectedOptions[0].text;const taxa=parseFloat(document.getElementById('taxaFixa').value)||0;const valor=parseFloat(document.getElementById('valorFixa').value)||0;if(valor<=0||taxa<=0) return alert('Taxa e valor');cart.ativos.push({id:Date.now(),tipo:'FIXA',ticker:nome,preco:valor,qtd:1,dy:taxa/100,dyTxt:`${taxa.toFixed(2)}%`,rendDia:valor*(taxa/100)/365,valor});}save();renderLista();document.getElementById('qtd').value='';document.getElementById('total').value='';document.getElementById('valorFixa').value='';}
function removerAtivo(id){const c=carteiras.find(x=>x.id===ativaId);c.ativos=c.ativos.filter(a=>a.id!==id);save();renderLista();}
function renderLista(){const carteira=carteiras.find(c=>c.id===ativaId);if(!carteira) return;document.getElementById('lista').innerHTML=carteira.ativos.map(a=>`<div class="bg-white/5 rounded-xl p-3 flex justify-between text-sm"><div><b>${a.ticker}</b> ${a.qtd?`x${a.qtd}`:''} <span class="text-emerald-400">${(a.dy*100).toFixed(2)}%</span><div class="mono text-[10px] text-white/40">R$ ${(a.rendDia/86400).toFixed(7)}/s</div></div><button onclick="removerAtivo(${a.id})">x</button></div>`).join('')||`<div class="text-xs opacity-30 text-center mt-6">Carteira vazia</div>`;const totalDia=carteira.ativos.reduce((a,b)=>a+b.rendDia,0);window.totalDia=totalDia;renderAbas();}
function toggleModal(){document.getElementById('modal').classList.toggle('translate-y-full');}
function togglePause(){pausado=!pausado;document.getElementById('btnPause').innerText=pausado?'▶ Continuar':'⏸ Pausar';}
function resetHoje(){inicio=new Date();inicio.setHours(0,0,0,0);}
setInterval(()=>{if(pausado) return;const seg=(new Date()-inicio)/1000;const ps=(window.totalDia||0)/86400;const acumulado=seg*ps;document.getElementById('valorGrande').innerText='R$ '+acumulado.toFixed(2);document.getElementById('acumuladoHoje').innerText='R$ '+acumulado.toFixed(2);document.getElementById('hojeTxt').innerText=`Hoje: R$ ${acumulado.toFixed(2)}`;document.getElementById('segTxt').innerText=`Por seg: R$ ${ps.toFixed(4)}`;document.getElementById('acumuladoSub').innerText=`O ativo(s) • R$ ${ps.toFixed(4)} por segundo • ${(carteiras.find(c=>c.id===ativaId)?.ativos.length||0)} ativos em ${carteiras.find(c=>c.id===ativaId)?.nome}`;},200);
renderAbas();renderLista();
</script>
</body>
</html>

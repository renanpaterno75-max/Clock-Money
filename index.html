<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Clock-Money v6.2 HD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--neon:#9effbf}
*{ -webkit-tap-highlight-color:transparent }
body{margin:0;min-height:100dvh;min-height:-webkit-fill-available;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;background:#080808;overflow:hidden;position:relative}
.bg-layer{position:fixed;inset:0;background-size:cover;background-position:center center;background-repeat:no-repeat;z-index:0;transform:scale(1.02);filter:contrast(1.1) brightness(0.9)}
.bg-layer.hd{background-image:url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1920&q=80&auto=format&fit=crop');image-rendering:-webkit-optimize-contrast}
.bg-overlay{position:fixed;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.92) 100%);z-index:1}
.mono{font-family:'JetBrains Mono',monospace}
.neon{color:var(--neon);text-shadow:0 0 12px var(--neon),0 0 28px rgba(158,255,191,.5)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}.pulse{animation:pulse 1.6s ease-in-out infinite}
.clock-wrap{position:relative;width:min(76vw,340px);height:min(76vw,340px);display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:2px;border-radius:50%;background:conic-gradient(var(--neon) var(--pct,0%), rgba(255,255,255,.10) 0%);-webkit-mask:radial-gradient(circle, transparent 69%, black 71%);mask:radial-gradient(circle, transparent 69%, black 71%)}
.clock{position:relative;width:88%;height:88%;border-radius:50%;background:radial-gradient(circle at 32% 28%,#232323 0%,#121212 40%,#080808 70%,#000 100%);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.15),0 20px 80px rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.glass{background:rgba(18,18,18,.88);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.10)}
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;z-index:2;padding:12px 0}
.footer{width:100%;max-width:400px;padding:0 20px 24px 20px;z-index:2;padding-bottom:calc(24px + env(safe-area-inset-bottom) + 72px)} /* 72px = altura da barra do Chrome */
@media(max-height:750px){.clock-wrap{width:min(68vw,300px);height:min(68vw,300px)}}
</style>
</head>
<body>
<div id="bgLayer" class="bg-layer hd"></div><div class="bg-overlay"></div>

<div class="z-10 w-full max-w-[980px] px-5 pt-[max(14px,env(safe-area-inset-top))] flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-white text-black font-bold flex items-center justify-center text-xs">C$</div><div><div class="text-white font-bold text-sm">CLOCK-MONEY</div><div class="text-white/40 text-[10px] tracking-widest">v6.2 HD</div></div></div>
<button onclick="toggleCustom()" class="glass px-4 py-2 rounded-full text-xs text-white">🎨 Personalizar</button>
</div>

<div id="abas" class="z-10 flex gap-2 mt-4 overflow-auto max-w-full px-5"></div>

<div class="content">
  <div class="clock-wrap"><div id="ring" class="ring"></div><div class="clock text-center"><div class="text-[9px] tracking-[0.5em] text-white/25 font-bold">HOJE</div><div id="valorGrande" class="mono font-extrabold neon pulse mt-1" style="font-size:42px">R$ 0,00</div><div class="mt-2 text-[10px] mono text-white/50"><span id="horaAgora">00:00:00</span> • <span id="segTxt">R$ 0,0000/s</span></div></div></div>
</div>

<div class="footer">
  <div class="glass rounded-[20px] p-5"><div class="text-[10px] tracking-[0.22em] text-white/35 font-bold">ACUMULADO DE HOJE</div><div id="acumuladoHoje" class="mono text-[28px] font-extrabold neon mt-1">R$ 0,00</div><div id="sub" class="mono text-[11px] text-white/50 mt-1">0 ativos • FIIs</div><div class="grid grid-cols-3 gap-2 mt-4"><div class="rounded-xl p-3 bg-white/[0.06] border border-white/10"><div class="text-[9px] text-white/40">HOJE</div><div id="cardHoje" class="mono text-sm font-bold text-white mt-1">R$ 0</div></div><div class="rounded-xl p-3 bg-white/[0.06] border border-white/10"><div class="text-[9px] text-white/40">MÊS</div><div id="cardMes" class="mono text-sm font-bold text-white mt-1">R$ 0</div></div><div class="rounded-xl p-3 bg-white/[0.06] border border-white/10"><div class="text-[9px] text-white/40">ANO</div><div id="cardAno" class="mono text-sm font-bold text-white mt-1">R$ 0</div></div></div></div>
  <div class="flex gap-2 mt-3"><button onclick="toggleModal()" class="flex-1 glass py-3.5 rounded-full text-white text-[13px] font-bold">◧ Editar carteira</button><button onclick="togglePause()" id="btnPause" class="glass w-12 h-12 rounded-full text-white">⏸</button></div>
</div>

<div id="customModal" class="fixed inset-0 z-[60] hidden"><div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="toggleCustom()"></div><div class="absolute top-0 right-0 h-full w-[380px] max-w-[90vw] bg-[#141414] border-l border-white/10 p-6 overflow-auto"><div class="flex justify-between items-center"><h2 class="font-bold text-white">🎨 Fundos HD</h2><button onclick="toggleCustom()" class="text-white/40">✕</button></div><div class="grid grid-cols-2 gap-3 mt-6">
<div onclick="setWallpaper('https://images.unsplash.com/photo-1517705008128-361805f42e86?w=1920&q=80&auto=format&fit=crop')"><img src="https://images.unsplash.com/photo-1517705008128-361805f42e86?w=300&q=80" class="w-full h-[80px] rounded-xl object-cover" loading="lazy"><div class="text-[11px] text-white/60 mt-1">🛏️ Quarto</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1585328001265-387d378b2e9c?w=1920&q=80&auto=format&fit=crop')"><img src="https://images.unsplash.com/photo-1585328001265-387d378b2e9c?w=300&q=80" class="w-full h-[80px] rounded-xl object-cover" loading="lazy"><div class="text-[11px] text-white/60 mt-1">🌿 Jardim</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1920&q=80&auto=format&fit=crop')"><img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=300&q=80" class="w-full h-[80px] rounded-xl object-cover" loading="lazy"><div class="text-[11px] text-white/60 mt-1">🏡 Mansão Piscina</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1920&q=80&auto=format&fit=crop')"><img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=300&q=80" class="w-full h-[80px] rounded-xl object-cover" loading="lazy"><div class="text-[11px] text-white/60 mt-1">🏎️ Garagem</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=1920&q=80&auto=format&fit=crop')"><img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=300&q=80" class="w-full h-[80px] rounded-xl object-cover" loading="lazy"><div class="text-[11px] text-white/60 mt-1">🏔️ Lago</div></div>
<div onclick="setWallpaper('')"><div class="w-full h-[80px] rounded-xl bg-zinc-800 flex items-center justify-center text-xs text-white/50">🌑 Dark 4K</div><div class="text-[11px] text-white/60 mt-1">Sem fundo</div></div>
</div><div class="mt-8 p-3 rounded-xl bg-white/5 text-[11px] text-white/50">Agora em HD 1920p • Antes tava 800px por isso ficou embaçado na sua print</div></div></div>

<div id="modal" class="fixed inset-0 z-50 translate-y-full transition-transform duration-500"><div class="absolute inset-0 bg-black/80" onclick="toggleModal()"></div><div class="absolute bottom-0 left-0 right-0 bg-[#141414] rounded-t-[28px] max-h-[88dvh] overflow-auto border-t border-white/10 p-6 pb-[calc(24px+env(safe-area-inset-bottom))]"><div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-5"></div><div id="abasModal" class="flex gap-2 overflow-auto"></div><div class="flex gap-2 mt-4"><button onclick="setTipo('B3')" id="b1" class="flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm">B3</button><button onclick="setTipo('FIXA')" id="b2" class="flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm">CDI</button></div><div id="fB3" class="mt-4"><input id="busca" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white placeholder-white/30" placeholder="MXRF11..." oninput="buscar(this.value)" onfocus="buscar(this.value)"><div id="sugestoes" class="mt-2 rounded-xl overflow-hidden hidden border border-white/10 bg-[#1e1e1e]"></div><div id="infoAtivo" class="hidden mt-3 text-white text-sm bg-white/5 p-3 rounded-xl"></div><div class="grid grid-cols-2 gap-3 mt-4"><input id="qtd" type="number" class="w-full bg-black border border-white/15 rounded-xl p-3 text-white font-bold" placeholder="QTD" oninput="onQtdChange()"><input id="total" type="number" class="w-full bg-black border border-white/15 rounded-xl p-3 text-emerald-400 font-bold" placeholder="TOTAL R$" oninput="onTotalChange()"></div></div><div id="fFIXA" class="hidden mt-5 space-y-3"><select id="tipoFixa" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white"><option value="12.15">100% CDI</option><option value="14.58">120% CDI</option><option value="7.5">Poupança</option></select><input id="nomeFixa" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white" placeholder="Nome"><div class="grid grid-cols-2 gap-3"><input id="taxaFixa" type="number" class="bg-black border border-white/15 rounded-xl p-4 text-white" placeholder="% a.a."><input id="valorFixa" type="number" class="bg-black border border-white/15 rounded-xl p-4 text-white" placeholder="Valor"></div></div><div id="preview" class="hidden mt-4 p-3 rounded-xl bg-white/5 text-white mono text-xs"></div><button onclick="adicionar()" class="w-full bg-white text-black font-bold rounded-2xl p-4 mt-4">+ Adicionar</button><div id="lista" class="mt-6 space-y-2 pb-10"></div></div></div>

<script>
const POPULARES=["MXRF11","HGLG11","KNRI11","XPLG11","BCFF11","PETR4","VALE3","WEGE3","ITUB4"];
let carteiras=JSON.parse(localStorage.getItem('carteirasV24')||'null')||[{id:1,nome:'FIIs',ativos:[]},{id:2,nome:'Ações',ativos:[]},{id:3,nome:'Reserva CDI',ativos:[]}];
let ativaId=1,sel=null,trava=false,inicio=new Date();inicio.setHours(0,0,0,0);let pausado=false;window.tipoAtivo='B3';
let prefs=JSON.parse(localStorage.getItem('prefsV62')||'{"neon":"#9effbf","wall":"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1920&q=80&auto=format&fit=crop"}');
function applyPrefs(){document.documentElement.style.setProperty('--neon',prefs.neon);document.getElementById('bgLayer').style.backgroundImage=prefs.wall?`url('${prefs.wall}')`:'none';localStorage.setItem('prefsV62',JSON.stringify(prefs));}
function setNeon(c){prefs.neon=c;applyPrefs();}function setWallpaper(url){prefs.wall=url;applyPrefs();toggleCustom();}function toggleCustom(){document.getElementById('customModal').classList.toggle('hidden');}
function save(){localStorage.setItem('carteirasV24',JSON.stringify(carteiras));}
function renderAbas(){const h=carteiras.map(c=>`<button onclick="trocaAba(${c.id})" class="px-4 py-2 rounded-full text-xs font-bold ${c.id===ativaId?'bg-white text-black':'glass text-white/60'}">${c.nome}</button>`).join('');document.getElementById('abas').innerHTML=h;document.getElementById('abasModal').innerHTML=h;}
function trocaAba(id){ativaId=id;renderAbas();renderLista();}function setTipo(t){window.tipoAtivo=t;document.getElementById('fB3').classList.toggle('hidden',t!=='B3');document.getElementById('fFIXA').classList.toggle('hidden',t!=='FIXA');document.getElementById('b1').className=t==='B3'?'flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm':'flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm';document.getElementById('b2').className=t==='FIXA'?'flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm':'flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm';}
function buscar(q){const d=document.getElementById('sugestoes');const termo=(q||'').toUpperCase();let lista=POPULARES.filter(t=>t.includes(termo)).slice(0,6);if(termo.length===0)lista=POPULARES.slice(0,5);d.innerHTML=lista.map(t=>`<div class="px-4 py-3 text-white text-sm hover:bg-white/10 cursor-pointer" onclick="selecionar('${t}')">${t}</div>`).join('');d.classList.remove('hidden');}
async function selecionar(t){document.getElementById('busca').value=t;document.getElementById('sugestoes').classList.add('hidden');let preco=t.includes('11')?10.25:42.6;let dy=t.includes('11')?0.12:0.06;try{const r=await fetch(`https://brapi.dev/api/quote/${t}?token=qtZQumqzTgLyLYyMd5Ph9n&dividends=true`);const j=await r.json();const d=j.results?.[0];if(d?.regularMarketPrice)preco=d.regularMarketPrice;}catch(e){}sel={ticker:t,preco,dy,rendDia:preco*dy/365};document.getElementById('infoAtivo').classList.remove('hidden');document.getElementById('infoAtivo').innerText=`${t} • R$ ${preco.toFixed(2)} • ${(dy*100).toFixed(2)}%`;document.getElementById('preview').classList.remove('hidden');document.getElementById('preview').innerText=`${t} • R$ ${preco.toFixed(2)}`;}
function onQtdChange(){if(trava||!sel) return;trava=true;document.getElementById('total').value=(parseFloat(document.getElementById('qtd').value||0)*sel.preco).toFixed(2);trava=false;}function onTotalChange(){if(trava||!sel) return;trava=true;document.getElementById('qtd').value=Math.floor((parseFloat(document.getElementById('total').value||0)/sel.preco));trava=false;}
function adicionar(){const c=carteiras.find(x=>x.id===ativaId);if(window.tipoAtivo==='B3'){const qtd=parseInt(document.getElementById('qtd').value)||0;if(!sel||!qtd)return;c.ativos.push({id:Date.now(),ticker:sel.ticker,qtd,preco:sel.preco,dy:sel.dy,rendDia:(sel.preco*sel.dy/365)*qtd});}else{const taxa=parseFloat(document.getElementById('taxaFixa').value)||0;const valor=parseFloat(document.getElementById('valorFixa').value)||0;const nome=document.getElementById('nomeFixa').value||'Reserva';c.ativos.push({id:Date.now(),ticker:nome,preco:valor,qtd:1,dy:taxa/100,rendDia:valor*(taxa/100)/365});}save();renderLista();}
function renderLista(){const c=carteiras.find(x=>x.id===ativaId);window.totalDia=c?c.ativos.reduce((a,b)=>a+b.rendDia,0):0;document.getElementById('lista').innerHTML=c?c.ativos.map(a=>`<div class="bg-white/5 rounded-xl p-3 flex justify-between text-white text-sm"><div><b>${a.ticker}</b> x${a.qtd}</div><button onclick="removerAtivo(${a.id})">x</button></div>`).join(''):'';renderAbas();}
function removerAtivo(id){const c=carteiras.find(x=>x.id===ativaId);c.ativos=c.ativos.filter(a=>a.id!==id);save();renderLista();}
function toggleModal(){document.getElementById('modal').classList.toggle('translate-y-full');}function togglePause(){pausado=!pausado;document.getElementById('btnPause').innerText=pausado?'▶':'⏸';}function resetHoje(){inicio=new Date();inicio.setHours(0,0,0,0);}
setInterval(()=>{if(pausado) return;const agora=new Date();const seg=(agora-inicio)/1000;const ps=(window.totalDia||0)/86400;const acum=seg*ps;const fmt='R$ '+acum.toFixed(2).replace('.',',');document.getElementById('valorGrande').innerText=fmt;document.getElementById('acumuladoHoje').innerText=fmt;document.getElementById('cardHoje').innerText='R$ '+acum.toFixed(2);document.getElementById('cardMes').innerText='R$ '+((window.totalDia||0)*30).toFixed(0);document.getElementById('cardAno').innerText='R$ '+((window.totalDia||0)*365).toFixed(0);document.getElementById('segTxt').innerText=`R$ ${ps.toFixed(4).replace('.',',')}/s`;document.getElementById('horaAgora').innerText=agora.toLocaleTimeString('pt-BR');const pct=(agora.getHours()*3600+agora.getMinutes()*60+agora.getSeconds())/86400;document.getElementById('ring').style.setProperty('--pct',(pct*100)+'%');const sub=document.getElementById('sub');if(sub)sub.innerText=`${carteiras.find(c=>c.id===ativaId)?.ativos.length||0} ativo(s) • R$ ${ps.toFixed(4).replace('.',',')}/s • ${carteiras.find(c=>c.id===ativaId)?.nome||''}`;},120);
applyPrefs();renderAbas();renderLista();
</script>
</body>
</html>

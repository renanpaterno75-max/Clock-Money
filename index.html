<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock Money</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ff66">
  <link rel="apple-touch-icon" href="icon-512.jpg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #00ff66;
      font-size: 3em;
      text-shadow: 0 0 20px #00ff66;
    }
    .card {
      background: #151530;
      padding: 30px;
      border-radius: 20px;
      border: 2px solid #00ff66;
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
    }
    .btn {
      background: #00ff66;
      color: #000;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.1em;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    #installBtn {
      display: none;
      background: #fff;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
      font-size: 1em;
    }
    #result {
      font-size: 2.5em;
      color: #00ff66;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>⏰ Clock Money</h1>
  <p>Transforme seu tempo em dinheiro</p>

  <div class="card">
    <label>Valor por hora (R$)</label>
    <input id="rate" type="number" value="50">

    <label style="margin-top:15px; display:block;">Horas trabalhadas</label>
    <input id="hours" type="number" value="1" step="0.1">

    <div id="result">R$ 50,00</div>

    <button class="btn" onclick="calc()">Calcular</button>
    <button id="installBtn" class="btn">📲 Instalar App</button>
  </div>

  <script>
    function calc() {
      const r = parseFloat(document.getElementById('rate').value) || 0;
      const h = parseFloat(document.getElementById('hours').value) || 0;
      document.getElementById('result').innerText = 
        'R$ ' + (r * h).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    }
    document.getElementById('rate').addEventListener('input', calc);
    document.getElementById('hours').addEventListener('input', calc);

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });
    document.getElementById('installBtn').addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => deferredPrompt = null);
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>

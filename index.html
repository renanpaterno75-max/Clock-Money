<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock-Money PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter}.mono{font-family:'JetBrains Mono'}.glass{backdrop-filter:blur(16px); background:rgba(255,255,255,0.08);}</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col items-center p-4">
<div class="w-full max-w-5xl">
<header class="flex justify-between items-center py-6"><h1 class="text-2xl font-bold">⏰ CLOCK-MONEY <span class="text-emerald-400">PRO</span></h1><div class="text-sm opacity-60" id="horaReal"></div></header>
<div class="grid md:grid-cols-3 gap-6">
<div class="md:col-span-2 glass rounded-[30px] p-8 border border-white/10 flex flex-col items-center justify-center min-h-[400px]">
<div class="relative w-[280px] h-[280px] rounded-full border-[10px] border-white/10 flex items-center justify-center bg-black shadow-[0_0_80px_rgba(16,185,129,0.3)]">
<div class="text-center"><div id="valor" class="mono text-5xl font-bold text-emerald-400">R$ 0,0000</div><div class="text-xs opacity-50 mt-2 tracking-widest">GANHANDO AGORA</div><div id="porSegundo" class="mono text-sm mt-3 text-emerald-300">R$ 0,0000 / seg</div></div>
</div>
<div class="grid grid-cols-3 gap-4 w-full mt-8"><div class="glass rounded-2xl p-4 text-center"><div class="text-xs opacity-50">HOJE</div><div id="hoje" class="mono text-lg font-bold">R$ 0,00</div></div><div class="glass rounded-2xl p-4 text-center"><div class="text-xs opacity-50">MÊS</div><div id="mes" class="mono text-lg font-bold">R$ 0,00</div></div><div class="glass rounded-2xl p-4 text-center"><div class="text-xs opacity-50">ANO</div><div id="ano" class="mono text-lg font-bold">R$ 0,00</div></div></div>
</div>
<div class="glass rounded-[30px] p-6 border border-white/10">
<h3 class="font-bold mb-4">Adicionar Ativo</h3>
<input id="ticker" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-3 outline-none focus:border-emerald-500" placeholder="Ticker ex: PETR4">
<input id="qtd" type="number" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-3" placeholder="Quantidade">
<input id="rendDia" type="number" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 mb-3" placeholder="Renda por dia R$">
<button onclick="adicionar()" class="w-full bg-emerald-400 text-black font-bold rounded-xl p-3 hover:bg-emerald-300">Adicionar</button>
<div id="lista" class="mt-6 space-y-2 max-h-[250px] overflow-auto"></div>
<button onclick="zerar()" class="w-full mt-4 text-xs opacity-30">Zerar contador do dia</button>
</div>
</div>
</div>
<script>
let totalDia = parseFloat(localStorage.getItem('totalDia'))||0;
let carteira=JSON.parse(localStorage.getItem('carteira')||'[]');
let inicio=new Date(); inicio.setHours(0,0,0,0);
function salvar(){localStorage.setItem('totalDia',totalDia);localStorage.setItem('carteira',JSON.stringify(carteira));}
function renderLista(){
  let el=document.getElementById('lista'); el.innerHTML='';
  carteira.forEach((c,i)=>{
    let ps=c.rendDia/86400;
    el.innerHTML+=`<div class="bg-black/40 rounded-xl p-3 flex justify-between items-center border border-white/5"><div><div class="font-bold text-sm">${c.ticker} <span class="opacity-50 font-normal">x${c.qtd}</span></div><div class="mono text-xs text-emerald-400">R$ ${ps.toFixed(4)}/s</div></div><button onclick="remover(${i})" class="opacity-30">x</button></div>`;
  });
  document.getElementById('hoje').innerText='R$ '+totalDia.toFixed(2);
  document.getElementById('mes').innerText='R$ '+(totalDia*30).toFixed(2);
  document.getElementById('ano').innerText='R$ '+(totalDia*365).toFixed(2);
}
function adicionar(){
  let t=document.getElementById('ticker').value.toUpperCase()||'ATIVO';
  let q=document.getElementById('qtd').value||0;
  let r=parseFloat(document.getElementById('rendDia').value); if(!r) return alert('Digite renda/dia');
  carteira.push({ticker:t,qtd:q,rendDia:r}); totalDia+=r; salvar(); renderLista();
  document.getElementById('ticker').value='';document.getElementById('qtd').value='';document.getElementById('rendDia').value='';
}
function remover(i){ totalDia-=carteira[i].rendDia; carteira.splice(i,1); salvar(); renderLista(); }
function zerar(){ localStorage.setItem('acumuladoOffset',document.getElementById('valor').innerText); inicio=new Date(); }
setInterval(()=>{
  let seg=(new Date()-inicio)/1000; let ps=totalDia/86400; let acum=seg*ps;
  document.getElementById('valor').innerText='R$ '+acum.toFixed(4);
  document.getElementById('porSegundo').innerText='R$ '+ps.toFixed(4)+' / seg';
  document.getElementById('horaReal').innerText=new Date().toLocaleTimeString();
},80);
renderLista();
</script>
</body>
</html>

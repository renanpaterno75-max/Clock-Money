<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Money</title>
<link rel="manifest" href="/public/manifest.json">
<meta name="theme-color" content="#39ff14">
<link rel="apple-touch-icon" href="/public/icon-512.jpg">
<style>
  body{background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;padding:40px}
  h1{color:#39ff14;font-size:3em}
  .btn{background:#39ff14;color:#000;padding:15px 30px;border:none;border-radius:10px;font-size:1.2em;font-weight:bold;cursor:pointer;margin:10px}
  #installBtn{display:none}
</style>
</head>
<body>
<h1>⏰ Clock Money 💰</h1>
<p>Seu tempo vale dinheiro!</p>
<button class="btn" onclick="alert('App funcionando!')">Começar</button>
<button id="installBtn" class="btn">📲 Instalar App</button>

<script>
// PWA Install
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display='inline-block';
});
document.getElementById('installBtn').addEventListener('click', () => {
  if(deferredPrompt){deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{deferredPrompt=null})}
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/public/sw.js');
}
</script>
</body>
</html>

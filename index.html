<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock-Money - Seu Tempo é Dinheiro</title>
<style>
body { margin:0; background:#0a0a0a; color:white; font-family: sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background-image: url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85'); background-size:cover; background-position:center; }
.card { background: rgba(0,0,0,0.8); padding:30px; border-radius:20px; text-align:center; backdrop-filter: blur(10px); border:1px solid #333; width:90%; max-width:400px; }
.clock { width:280px; height:280px; border:8px solid #fff; border-radius:50%; margin:20px auto; display:flex; flex-direction:column; align-items:center; justify-content:center; background: radial-gradient(#222, #000); box-shadow: 0 0 40px rgba(0,255,100,0.3); }
#valor { font-size:42px; font-weight:bold; color:#00ff88; }
#detalhe { font-size:14px; opacity:0.7; margin-top:10px; }
input { width:100%; padding:10px; margin:5px 0; border-radius:8px; border:none; }
button { width:100%; padding:12px; background:#00ff88; color:black; font-weight:bold; border:none; border-radius:8px; margin-top:10px; cursor:pointer; }
.lista { text-align:left; font-size:14px; margin-top:15px; max-height:150px; overflow:auto; }
</style>
</head>
<body>
<div class="card">
<h2>⏰ Clock-Money</h2>
<div class="clock">
<div id="valor">R$ 0,0000</div>
<div id="detalhe">R$ 0,00 / dia<br><span id="porSegundo">R$ 0,0000 / seg</span></div>
</div>
<input id="acao" placeholder="Ex: PETR4">
<input id="qtd" type="number" placeholder="Quantidade">
<input id="rendDia" type="number" placeholder="Rende por dia R$ (ex: 1000)">
<button onclick="adicionar()">Adicionar à carteira</button>
<button onclick="zerar()" style="background:#333;color:white;">Zerar hoje</button>
<div class="lista" id="lista"></div>
</div>
<script>
let totalDia = parseFloat(localStorage.getItem('totalDia')) || 0;
let carteira = JSON.parse(localStorage.getItem('carteira')||'[]');
let acumulado = 0;
let inicioDia = new Date(); inicioDia.setHours(0,0,0,0);

function atualizarLista(){
  document.getElementById('lista').innerHTML = carteira.map(c=>`• ${c.acao} - ${c.qtd} - R$${c.rendDia}/dia`).join('<br>');
  document.getElementById('detalhe').innerHTML = `Hoje: R$ ${totalDia.toFixed(2)}<br><span id="porSegundo">R$ ${(totalDia/86400).toFixed(4)} / seg</span>`;
}
function adicionar(){
  let acao=document.getElementById('acao').value;
  let qtd=document.getElementById('qtd').value;
  let rendDia=parseFloat(document.getElementById('rendDia').value);
  if(!rendDia) return alert('Digite o rendimento por dia');
  carteira.push({acao,qtd,rendDia});
  totalDia+=rendDia;
  localStorage.setItem('carteira',JSON.stringify(carteira));
  localStorage.setItem('totalDia',totalDia);
  document.getElementById('acao').value='';document.getElementById('qtd').value='';document.getElementById('rendDia').value='';
  atualizarLista();
}
function zerar(){ acumulado=0; inicioDia=new Date(); inicioDia.setHours(0,0,0,0); }
setInterval(()=>{
  let agora=new Date();
  let segundosDesdeMeiaNoite = (agora - inicioDia)/1000;
  let porSegundo = totalDia/86400;
  acumulado = segundosDesdeMeiaNoite * porSegundo;
  document.getElementById('valor').innerText = 'R$ ' + acumulado.toFixed(4);
},100);
atualizarLista();
</script>
</body>
</html>

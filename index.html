<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock-Money Custom</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--neon:#9effbf;--neon-glow:rgba(158,255,191,.55)}
body{margin:0;min-height:100dvh;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;transition:background.5s}
.bg-dark{background:#080808}.bg-graphite{background:radial-gradient(circle at 50% 0%,#1a1a1a,#080808)}.bg-warm{background:radial-gradient(circle at 50% 30%,#1e1810 0%,#0e0a06 50%,#050301 100%)}.bg-purple{background:radial-gradient(circle at 50% 0%,#1a1025,#08060e)}.bg-matrix{background:radial-gradient(circle at 50% 0%,#0a1a0e,#050805)}
.mono{font-family:'JetBrains Mono',monospace}
.neon{color:var(--neon);text-shadow:0 0 12px var(--neon),0 0 32px var(--neon-glow)}
@keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.03);filter:brightness(1.25)}}.pulse{animation:pulse 1.6s ease-in-out infinite}
.clock-wrap{position:relative;width:380px;height:380px;max-width:84vw;max-height:84vw}
.progress-ring{position:absolute;inset:0;transform:rotate(-90deg)}.progress-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.bg-ring{stroke:rgba(255,255,255,.06)}.fg-ring{stroke:var(--neon);filter:drop-shadow(0 0 8px var(--neon));transition:stroke-dashoffset.5s}
.clock{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#232323 0%,#121212 40%,#080808 70%,#000 100%);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 1px rgba(255,255,255,.12),0 20px 80px rgba(0,0,0,.9)}
.glass{background:rgba(22,22,22,.88);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.2);transition:transform.2s}
.color-dot.active{transform:scale(1.25);border-color:white;box-shadow:0 0 12px currentColor}
</style>
</head>
<body class="bg-dark relative">

<div class="z-10 w-full max-w-[980px] px-5 pt-6 flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-white text-black font-bold flex items-center justify-center text-xs">C$</div><div><div class="text-white font-bold text-sm">CLOCK-MONEY</div><div class="text-white/40 text-[10px] tracking-[0.2em]">v5.0 CUSTOM</div></div></div>
<div class="flex gap-2"><button onclick="toggleCustom()" class="glass px-4 py-2 rounded-full text-xs text-white">🎨 Personalizar</button><div id="totalGeral" class="glass px-4 py-2 rounded-full text-xs mono text-white/70 hidden md:block"></div></div>
</div>

<div id="abas" class="z-10 flex gap-2 mt-6 overflow-auto max-w-full px-5"></div>

<div class="z-10 flex-1 flex flex-col lg:flex-row items-center justify-center gap-10 w-full max-w-[980px] px-5 py-8">
  <div class="clock-wrap">
    <svg class="progress-ring" viewBox="0 0 100 100"><circle class="bg-ring" cx="50" cy="50" r="47"/><circle id="fgRing" class="fg-ring" cx="50" cy="50" r="47" stroke-dasharray="295" stroke-dashoffset="295"/></svg>
    <div class="clock flex flex-col items-center justify-center text-center">
      <div class="text-[9px] tracking-[0.5em] text-white/20 font-bold">HOJE</div>
      <div id="valorGrande" class="mono font-extrabold neon pulse mt-1 tracking-tighter" style="font-size:46px">R$ 0,00</div>
      <div class="mt-2 flex items-center gap-2 text-[10px] mono text-white/40"><span id="horaAgora">00:00:00</span><span class="w-1 h-1 rounded-full animate-pulse" style="background:var(--neon)"></span><span id="segTxt">R$ 0,0000/s</span></div>
    </div>
  </div>
  <div class="w-full max-w-[380px] space-y-3">
    <div class="glass rounded-[20px] p-5"><div class="text-[10px] tracking-[0.22em] text-white/35 font-bold">ACUMULADO DE HOJE</div><div id="acumuladoHoje" class="mono text-[30px] font-extrabold neon mt-1">R$ 0,00</div><div id="sub" class="mono text-[11px] text-white/45 mt-1"></div>
      <div class="grid grid-cols-3 gap-2 mt-5">
        <div class="rounded-xl p-3 bg-white/[0.05] border border-white/10"><div class="text-[9px] text-white/30">HOJE</div><div id="cardHoje" class="mono text-sm font-bold text-white mt-1">R$ 0</div></div>
        <div class="rounded-xl p-3 bg-white/[0.05] border border-white/10"><div class="text-[9px] text-white/30">MÊS</div><div id="cardMes" class="mono text-sm font-bold text-white mt-1">R$ 0</div></div>
        <div class="rounded-xl p-3 bg-white/[0.05] border border-white/10"><div class="text-[9px] text-white/30">ANO</div><div id="cardAno" class="mono text-sm font-bold text-white mt-1">R$ 0</div></div>
      </div>
    </div>
    <div class="flex gap-2"><button onclick="toggleModal()" class="flex-1 glass py-3.5 rounded-full text-white text-[13px] font-bold">◧ Editar carteira</button><button onclick="togglePause()" id="btnPause" class="glass w-12 h-12 rounded-full text-white">⏸</button><button onclick="resetHoje()" class="glass w-12 h-12 rounded-full text-white">↺</button></div>
  </div>
</div>

<!-- PAINEL PERSONALIZAÇÃO -->
<div id="customModal" class="fixed inset-0 z-[60] hidden">
<div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="toggleCustom()"></div>
<div class="absolute top-0 right-0 h-full w-[360px] max-w-[85vw] bg-[#141414] border-l border-white/10 p-6 overflow-auto">
<div class="flex justify-between items-center"><h2 class="font-bold text-white">🎨 Personalizar</h2><button onclick="toggleCustom()" class="text-white/40">✕</button></div>

<div class="mt-8"><div class="text-xs text-white/60 mb-3 font-bold tracking-widest">COR DO NEON</div>
<div class="flex gap-3 flex-wrap">
<div class="color-dot active" style="background:#9effbf;color:#9effbf" onclick="setNeon('#9effbf','rgba(158,255,191,.55)',this)"></div>
<div class="color-dot" style="background:#60a5fa;color:#60a5fa" onclick="setNeon('#60a5fa','rgba(96,165,250,.55)',this)"></div>
<div class="color-dot" style="background:#ffffff;color:#ffffff" onclick="setNeon('#ffffff','rgba(255,255,255,.4)',this)"></div>
<div class="color-dot" style="background:#f472b6;color:#f472b6" onclick="setNeon('#f472b6','rgba(244,114,182,.55)',this)"></div>
<div class="color-dot" style="background:#fbbf24;color:#fbbf24" onclick="setNeon('#fbbf24','rgba(251,191,36,.55)',this)"></div>
<div class="color-dot" style="background:#a78bfa;color:#a78bfa" onclick="setNeon('#a78bfa','rgba(167,139,250,.55)',this)"></div>
</div></div>

<div class="mt-8"><div class="text-xs text-white/60 mb-3 font-bold tracking-widest">PLANO DE FUNDO</div>
<div class="grid grid-cols-1 gap-2">
<button onclick="setBg('bg-dark')" class="text-left px-4 py-3 rounded-xl bg-[#1a1a1a] border border-white/10 text-white text-sm">🌑 Dark Puro</button>
<button onclick="setBg('bg-graphite')" class="text-left px-4 py-3 rounded-xl bg-[#222] border border-white/10 text-white text-sm">🪨 Graphite</button>
<button onclick="setBg('bg-warm')" class="text-left px-4 py-3 rounded-xl bg-[#1e1810] border border-white/10 text-white text-sm">🛋️ Quarto Quente</button>
<button onclick="setBg('bg-purple')" class="text-left px-4 py-3 rounded-xl bg-[#1a1025] border border-white/10 text-white text-sm">💜 Roxo Neon</button>
<button onclick="setBg('bg-matrix')" class="text-left px-4 py-3 rounded-xl bg-[#0a1a0e] border border-white/10 text-white text-sm">🟩 Matrix</button>
</div></div>

<div class="mt-8"><div class="text-xs text-white/60 mb-3 font-bold tracking-widest">TAMANHO DA FONTE</div>
<div class="flex gap-2">
<button onclick="setSize(36)" class="flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm">Pequeno</button>
<button onclick="setSize(46)" class="flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm">Médio</button>
<button onclick="setSize(58)" class="flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm">Gigante</button>
</div>
<input id="sizeSlider" type="range" min="28" max="72" value="46" class="w-full mt-4 accent-white" oninput="setSize(this.value)">
</div>

<div class="mt-10 p-4 rounded-xl bg-white/5 border border-white/10 text-xs text-white/50">Dica: Use branco + fundo Quarto Quente para ficar igual ao print do Lovable que você mandou!</div>
</div>
</div>

<!-- MODAL CARTEIRA (igual antes) -->
<div id="modal" class="fixed inset-0 z-50 translate-y-full transition-transform duration-500">
<div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="toggleModal()"></div>
<div class="absolute bottom-0 left-0 right-0 bg-[#141414] rounded-t-[28px] max-h-[88dvh] overflow-auto border-t border-white/10 p-6">
<div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-5"></div>
<div class="flex justify-between items-center text-white"><h2 class="font-bold">Carteiras</h2><button onclick="novaAba()" class="text-xs bg-white text-black px-3 py-1.5 rounded-full font-bold">+ Nova</button></div>
<div id="abasModal" class="flex gap-2 mt-4 overflow-auto"></div>
<div class="flex gap-2 mt-5"><button onclick="setTipo('B3')" id="b1" class="flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm">B3</button><button onclick="setTipo('FIXA')" id="b2" class="flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm">CDI / Poupança</button></div>
<div id="fB3" class="mt-5">
<input id="busca" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white placeholder-white/30 outline-none" placeholder="MXRF11, WEGE3..." oninput="buscar(this.value)" onfocus="buscar(this.value)">
<div id="sugestoes" class="mt-2 rounded-xl overflow-hidden hidden border border-white/10 bg-[#1e1e1e]"></div>
<div id="infoAtivo" class="hidden mt-3 text-white text-sm bg-white/5 p-3 rounded-xl"></div>
<div class="grid grid-cols-2 gap-3 mt-4"><input id="qtd" type="number" class="w-full bg-black border border-white/15 rounded-xl p-3 text-white font-bold" placeholder="QTD" oninput="onQtdChange()"><input id="total" type="number" class="w-full bg-black border border-white/15 rounded-xl p-3 text-emerald-400 font-bold" placeholder="TOTAL R$" oninput="onTotalChange()"></div>
</div>
<div id="fFIXA" class="hidden mt-5 space-y-3"><select id="tipoFixa" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white" onchange="trocaFixa()"><option value="12.15">100% CDI • 12,15%</option><option value="14.58">120% CDI • 14,58%</option><option value="7.5">Poupança • 7,5%</option></select><input id="nomeFixa" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white" placeholder="Nome"><div class="grid grid-cols-2 gap-3"><input id="taxaFixa" type="number" class="bg-black border border-white/15 rounded-xl p-4 text-white mono" placeholder="% a.a."><input id="valorFixa" type="number" class="bg-black border border-white/15 rounded-xl p-4 text-white mono" placeholder="Valor R$"></div></div>
<div id="preview" class="hidden mt-4 p-3 rounded-xl bg-white/5 text-white mono text-xs"></div>
<button onclick="adicionar()" class="w-full bg-white text-black font-bold rounded-2xl p-4 mt-4">+ Adicionar</button>
<div id="lista" class="mt-6 space-y-2 pb-10"></div>
</div>
</div>

<script>
const POPULARES=["MXRF11","HGLG11","KNRI11","XPLG11","BCFF11","PETR4","VALE3","WEGE3","ITUB4"];
let carteiras=JSON.parse(localStorage.getItem('carteirasV24')||'null')||[{id:1,nome:'FIIs',ativos:[]},{id:2,nome:'Ações',ativos:[]},{id:3,nome:'Reserva',ativos:[]}];
let ativaId=parseInt(localStorage.getItem('ativaId')||'1');let sel=null,trava=false,inicio=new Date();inicio.setHours(0,0,0,0);let pausado=false;window.tipoAtivo='B3';
let prefs=JSON.parse(localStorage.getItem('prefsV5')||'{"neon":"#9effbf","glow":"rgba(158,255,191,.55)","bg":"bg-dark","size":46}');
function applyPrefs(){document.documentElement.style.setProperty('--neon',prefs.neon);document.documentElement.style.setProperty('--neon-glow',prefs.glow);document.body.className=document.body.className.split(' ').filter(c=>!c.startsWith('bg-')).join(' ')+' '+prefs.bg+' relative flex flex-col items-center';document.getElementById('valorGrande').style.fontSize=prefs.size+'px';document.getElementById('sizeSlider').value=prefs.size;localStorage.setItem('prefsV5',JSON.stringify(prefs));}
function setNeon(c,g,el){prefs.neon=c;prefs.glow=g;document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');applyPrefs();}
function setBg(bg){prefs.bg=bg;applyPrefs();}
function setSize(s){prefs.size=s;applyPrefs();}
function toggleCustom(){document.getElementById('customModal').classList.toggle('hidden');}
function save(){localStorage.setItem('carteirasV24',JSON.stringify(carteiras));localStorage.setItem('ativaId',ativaId);}
function renderAbas(){const h=carteiras.map(c=>`<button onclick="trocaAba(${c.id})" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap ${c.id===ativaId?'bg-white text-black':'glass text-white/60'}">${c.nome}</button>`).join('');document.getElementById('abas').innerHTML=h;document.getElementById('abasModal').innerHTML=h;const tg=carteiras.reduce((a,c)=>a+c.ativos.reduce((x,y)=>x+y.rendDia,0),0);document.getElementById('totalGeral').innerText=`TOTAL R$ ${(tg*30).toFixed(0)}/mês`;}
function trocaAba(id){ativaId=id;save();renderAbas();renderLista();}function novaAba(){const n=prompt('Nome:');if(!n) return;const id=Date.now();carteiras.push({id,nome:n,ativos:[]});ativaId=id;save();renderAbas();renderLista();}
function setTipo(t){window.tipoAtivo=t;document.getElementById('fB3').classList.toggle('hidden',t!=='B3');document.getElementById('fFIXA').classList.toggle('hidden',t!=='FIXA');document.getElementById('b1').className=t==='B3'?'flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm':'flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm';document.getElementById('b2').className=t==='FIXA'?'flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm':'flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm';}
function trocaFixa(){document.getElementById('taxaFixa').value=document.getElementById('tipoFixa').value;}
function buscar(q){const d=document.getElementById('sugestoes');const termo=(q||'').toUpperCase();let lista=POPULARES.filter(t=>t.includes(termo)).slice(0,8);if(termo.length===0)lista=POPULARES.slice(0,6);if(lista.length===0)lista=[termo];d.innerHTML=lista.map(t=>`<div class="px-4 py-3.5 text-white font-semibold text-sm hover:bg-white/10 cursor-pointer border-b border-white/5" onclick="selecionar('${t}')">${t}</div>`).join('');d.classList.remove('hidden');}
async function selecionar(t){document.getElementById('busca').value=t;document.getElementById('sugestoes').classList.add('hidden');const prev=document.getElementById('preview');prev.classList.remove('hidden');prev.innerHTML=`Buscando ${t}...`;let preco=t.includes('11')?10.25:42.6;let dy=t.includes('11')?0.12:0.06;try{const r=await fetch(`https://brapi.dev/api/quote/${t}?token=qtZQumqzTgLyLYyMd5Ph9n&dividends=true`);const j=await r.json();const dados=j.results?.[0];if(dados?.regularMarketPrice)preco=dados.regularMarketPrice;if(dados?.dividendsData?.cashDividends?.length){const data12m=new Date();data12m.setFullYear(data12m.getFullYear()-1);const soma=dados.dividendsData.cashDividends.filter(x=>new Date(x.paymentDate)>data12m).reduce((a,b)=>a+(b.rate||0),0);if(soma>0)dy=soma/preco;}}catch(e){}sel={ticker:t,preco,dy,rendDia:preco*dy/365};document.getElementById('infoAtivo').classList.remove('hidden');document.getElementById('infoAtivo').innerText=`${t} • R$ ${preco.toFixed(2)} • ${(dy*100).toFixed(2)}% a.a.`;prev.innerHTML=`${t} • R$ ${preco.toFixed(2)} • ${(dy*100).toFixed(2)}%`;}
function onQtdChange(){if(trava||!sel) return;trava=true;const qtd=parseFloat(document.getElementById('qtd').value)||0;document.getElementById('total').value=qtd>0?(qtd*sel.preco).toFixed(2):'';trava=false;updPrev();}
function onTotalChange(){if(trava||!sel) return;trava=true;const total=parseFloat(document.getElementById('total').value)||0;document.getElementById('qtd').value=total>0?Math.floor(total/sel.preco):'';trava=false;updPrev();}
function updPrev(){if(!sel) return;const qtd=parseInt(document.getElementById('qtd').value)||0;const p=document.getElementById('preview');if(qtd>0){p.classList.remove('hidden');p.innerHTML=`${qtd} cotas = R$ ${(qtd*sel.preco).toFixed(2)} • R$ ${((sel.preco*sel.dy/365)*qtd).toFixed(2)}/dia`;}}
function adicionar(){const cart=carteiras.find(c=>c.id===ativaId);if((window.tipoAtivo||'B3')==='B3'){const qtd=parseInt(document.getElementById('qtd').value)||0;if(!sel||qtd<=0)return alert('QTD');cart.ativos.push({id:Date.now(),ticker:sel.ticker,qtd,preco:sel.preco,dy:sel.dy,rendDia:(sel.preco*sel.dy/365)*qtd});}else{const taxa=parseFloat(document.getElementById('taxaFixa').value)||0;const valor=parseFloat(document.getElementById('valorFixa').value)||0;const nome=document.getElementById('nomeFixa').value||'Reserva';if(!valor||!taxa)return;cart.ativos.push({id:Date.now(),ticker:nome,preco:valor,qtd:1,dy:taxa/100,rendDia:valor*(taxa/100)/365});}save();renderLista();document.getElementById('qtd').value='';document.getElementById('total').value='';document.getElementById('valorFixa').value='';document.getElementById('preview').classList.add('hidden');}
function removerAtivo(id){const c=carteiras.find(x=>x.id===ativaId);c.ativos=c.ativos.filter(a=>a.id!==id);save();renderLista();}
function renderLista(){const c=carteiras.find(x=>x.id===ativaId);const totalDia=c?c.ativos.reduce((a,b)=>a+b.rendDia,0):0;window.totalDia=totalDia;document.getElementById('lista').innerHTML=c?c.ativos.map(a=>`<div class="bg-white/[0.06] rounded-xl p-3 flex justify-between text-sm text-white"><div><b>${a.ticker}</b> ${a.qtd>1?`x${a.qtd}`:''} <span style="color:var(--neon)">${(a.dy*100).toFixed(2)}%</span><div class="mono text-[10px] text-white/40">R$ ${(a.rendDia/86400).toFixed(7)}/s</div></div><button onclick="removerAtivo(${a.id})" class="text-white/40">✕</button></div>`).join(''):'<div class="text-xs text-white/30 text-center py-6">Carteira vazia</div>';renderAbas();}
function toggleModal(){document.getElementById('modal').classList.toggle('translate-y-full');}
function togglePause(){pausado=!pausado;document.getElementById('btnPause').innerText=pausado?'▶':'⏸';}
function resetHoje(){inicio=new Date();inicio.setHours(0,0,0,0);}
setInterval(()=>{if(pausado) return;const agora=new Date();const seg=(agora-inicio)/1000;const ps=(window.totalDia||0)/86400;const acum=seg*ps;const fmt='R$ '+acum.toFixed(2).replace('.',',');document.getElementById('valorGrande').innerText=fmt;document.getElementById('acumuladoHoje').innerText=fmt;document.getElementById('cardHoje').innerText='R$ '+acum.toFixed(2);document.getElementById('cardMes').innerText='R$ '+((window.totalDia||0)*30).toFixed(0);document.getElementById('cardAno').innerText='R$ '+((window.totalDia||0)*365).toFixed(0);document.getElementById('segTxt').innerText=`R$ ${ps.toFixed(4).replace('.',',')}/s`;document.getElementById('sub').innerText=`${carteiras.find(c=>c.id===ativaId)?.ativos.length||0} ativos • R$ ${ps.toFixed(4).replace('.',',')}/s • ${carteiras.find(c=>c.id===ativaId)?.nome}`;document.getElementById('horaAgora').innerText=agora.toLocaleTimeString('pt-BR');const pctDia=(agora.getHours()*3600+agora.getMinutes()*60+agora.getSeconds())/86400;document.getElementById('fgRing').style.strokeDashoffset=295*(1-pctDia);},120);
applyPrefs();renderAbas();renderLista();
</script>
</body>
</html>

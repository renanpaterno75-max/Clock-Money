<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clock-Money v6.3</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --neon:#9effbf; --neon-glow: rgba(158,255,191,.5); }
  body{background:#080808; font-family:'Inter',sans-serif; min-height:100dvh; display:flex; flex-direction:column; align-items:center; overflow:hidden}
 .mono{font-family:'JetBrains Mono',monospace}
 .neon{color:var(--neon); text-shadow:0 0 12px var(--neon), 0 0 28px var(--neon-glow)}
 .glass{background:rgba(20,20,20,.9); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.1)}
 .ring{position:absolute; inset:0; border-radius:50%; background:conic-gradient(var(--neon) var(--pct,0%), rgba(255,255,255,.12) 0); -webkit-mask:radial-gradient(circle, transparent 68%, black 71%); mask:radial-gradient(circle, transparent 68%, black 71%)}
</style>
</head>
<body>

<!-- TOPO -->
<div class="w-full max-w-[980px] px-5 pt-4 flex justify-between items-center z-10">
  <div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full bg-white text-black font-bold grid place-items-center text-[11px]">C$</div><div class="text-white text-[13px] font-bold leading-none">CLOCK-MONEY <span class="block text-[9px] text-white/40 tracking-widest font-normal">DARK • NO WALLPAPER</span></div></div>
  <button onclick="toggleFontPanel()" class="glass px-4 py-2 rounded-full text-white text-xs font-bold">🎨 Fontes</button>
</div>

<!-- RELÓGIO -->
<div class="flex-1 w-full grid place-items-center z-10">
  <div class="relative w-[min(80vw,340px)] h-[min(80vw,340px)] grid place-items-center">
    <div id="ring" class="ring"></div>
    <div class="relative w-[88%] h-[88%] rounded-full bg-[radial-gradient(circle_at_30%_25%,#222,#0a0a0a_60%,#000)] border border-white/10 shadow-[0_20px_80px_rgba(0,0,0,.9)] grid place-items-center">
      <div class="text-center">
        <div id="txtHoje" class="text-white/40 font-bold tracking-[0.5em]">HOJE</div>
        <div id="valorGrande" class="mono font-extrabold neon mt-2 leading-none">R$ 0,00</div>
        <div class="flex items-center justify-center gap-2 mt-3 mono text-white/60">
          <span id="horaAgora">00:00:00</span><span class="w-1 h-1 bg-white/30 rounded-full"></span><span id="segTxt">R$ 0,0000/s</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="w-full max-w-[400px] px-5 pb-[calc(20px+env(safe-area-inset-bottom)+60px)] z-10">
  <div class="glass rounded-[22px] p-5">
    <div class="text-[10px] tracking-[0.2em] text-white/30 font-bold">ACUMULADO DE HOJE</div>
    <div id="acumuladoHoje" class="mono text-[28px] font-extrabold neon mt-1">R$ 0,00</div>
    <div id="sub" class="mono text-[11px] text-white/50 mt-1">0 ativos</div>
  </div>
  <div class="flex gap-2 mt-3">
    <button onclick="toggleModal()" class="flex-1 glass py-4 rounded-full text-white font-bold text-sm">◧ Editar carteira</button>
    <button onclick="togglePause()" id="btnPause" class="glass w-12 h-12 rounded-full text-white">⏸</button>
  </div>
</div>

<!-- PAINEL DE FONTES - REESCRITO -->
<div id="fontPanel" class="fixed inset-0 z-[70] hidden">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="toggleFontPanel()"></div>
  <div class="absolute right-0 top-0 h-full w-[360px] max-w-[92vw] bg-[#121212] border-l border-white/10 p-6 overflow-y-auto">
    <div class="flex justify-between items-center"><h2 class="text-white font-bold">Tamanho das fontes</h2><button onclick="toggleFontPanel()" class="text-white/40 text-xl">✕</button></div>

    <div id="fontControls" class="mt-8 space-y-7">
      <!-- Gerado via JS -->
    </div>

    <div class="mt-8 p-3 rounded-xl bg-white/[0.04] border border-white/10">
      <div class="text-[11px] font-bold text-white/70">PRESET RECOMENDADO PRA VOCÊ</div>
      <div class="text-xs text-white/50 mt-1">Valor 48px • HOJE 13px • Hora 14px • /s 14px</div>
      <button onclick="applyPreset()" class="w-full mt-3 py-2.5 rounded-xl bg-white text-black font-bold text-sm">Aplicar preset</button>
    </div>

    <div class="mt-6"><div class="text-[10px] tracking-widest text-white/30 font-bold">COR NEON</div>
      <div class="flex gap-3 mt-3"><button class="w-8 h-8 rounded-full bg-[#9effbf] border-2 border-white" onclick="setNeon('#9effbf')"></button><button class="w-8 h-8 rounded-full bg-[#60a5fa]" onclick="setNeon('#60a5fa')"></button><button class="w-8 h-8 rounded-full bg-white" onclick="setNeon('#ffffff')"></button><button class="w-8 h-8 rounded-full bg-[#fbbf24]" onclick="setNeon('#fbbf24')"></button></div>
    </div>
  </div>
</div>

<!-- MODAL CARTEIRA (mantido igual) -->
<div id="modal" class="fixed inset-0 z-50 translate-y-full transition-transform duration-500"><div class="absolute inset-0 bg-black/80" onclick="toggleModal()"></div><div class="absolute bottom-0 left-0 right-0 bg-[#141414] rounded-t-[28px] max-h-[85dvh] overflow-auto p-6"><div id="lista" class="space-y-2"></div><div class="h-10"></div></div></div>

<script>
/* ===== CONTROLE DE FONTES REESCRITO ===== */
const DEFAULT_FONTS = { main:46, hoje:9, hora:10, seg:10, neon:'#9effbf' };
let fonts = JSON.parse(localStorage.getItem('fontsV63')||'null') || {...DEFAULT_FONTS};

const FONT_ITEMS = [
  {key:'main', label:'Valor grande • R$ 0,00', min:30, max:70},
  {key:'hoje', label:'Rótulo HOJE', min:8, max:20},
  {key:'hora', label:'Horário • 10:59:45', min:9, max:22},
  {key:'seg', label:'Rendimento • R$ 0,0000/s', min:9, max:22},
];

function renderFontControls(){
  document.getElementById('fontControls').innerHTML = FONT_ITEMS.map(item=>`
    <div>
      <div class="flex justify-between"><span class="text-sm text-white font-semibold">${item.label}</span><span class="mono text-xs text-white/50" id="lb-${item.key}">${fonts[item.key]}px</span></div>
      <input type="range" min="${item.min}" max="${item.max}" value="${fonts[item.key]}" class="w-full mt-3 accent-white"
        oninput="updateFont('${item.key}', this.value)">
    </div>
  `).join('');
}

function updateFont(key, val){
  fonts[key] = parseInt(val);
  applyFonts();
}

function applyFonts(){
  document.getElementById('valorGrande').style.fontSize = fonts.main + 'px';
  document.getElementById('txtHoje').style.fontSize = fonts.hoje + 'px';
  document.getElementById('horaAgora').style.fontSize = fonts.hora + 'px';
  document.getElementById('segTxt').style.fontSize = fonts.seg + 'px';
  document.getElementById('fontControls')?.querySelectorAll('[id^="lb-"]').forEach(el=>{
    const k = el.id.replace('lb-',''); el.innerText = fonts[k]+'px';
  });
  document.documentElement.style.setProperty('--neon', fonts.neon);
  localStorage.setItem('fontsV63', JSON.stringify(fonts));
}

function applyPreset(){ fonts = {main:48, hoje:13, hora:14, seg:14, neon:fonts.neon}; renderFontControls(); applyFonts(); }
function setNeon(c){ fonts.neon=c; applyFonts(); }
function toggleFontPanel(){ document.getElementById('fontPanel').classList.toggle('hidden'); }

/* ===== LÓGICA MÍNIMA PRA RODAR (igual antes) ===== */
let totalDia = 0.85; // R$ por dia - substitua pela sua carteira
let inicio = new Date(); inicio.setHours(0,0,0,0); let pausado=false;
function toggleModal(){document.getElementById('modal').classList.toggle('translate-y-full')}
function togglePause(){pausado=!pausado; document.getElementById('btnPause').innerText=pausado?'▶':'⏸'}

setInterval(()=>{
  if(pausado) return;
  const agora = new Date();
  const segDia = (agora - inicio)/1000;
  const ps = totalDia/86400;
  const acum = segDia * ps;
  document.getElementById('valorGrande').innerText = 'R$ ' + acum.toFixed(2).replace('.',',');
  document.getElementById('acumuladoHoje').innerText = 'R$ ' + acum.toFixed(2).replace('.',',');
  document.getElementById('horaAgora').innerText = agora.toLocaleTimeString('pt-BR');
  document.getElementById('segTxt').innerText = `R$ ${ps.toFixed(4).replace('.',',')}/s`;
  document.getElementById('ring').style.setProperty('--pct', ((agora.getHours()*3600+agora.getMinutes()*60+agora.getSeconds())/86400*100)+'%');
},120);

renderFontControls(); applyFonts();
</script>
</body>
</html>

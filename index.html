<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock-Money v6 Wallpapers</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--neon:#9effbf;--neon-glow:rgba(158,255,191,.55)}
body{margin:0;min-height:100dvh;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;background:#080808;overflow:hidden;position:relative}
.bg-layer{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity.6s;z-index:0}
.bg-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,.25) 0%, rgba(0,0,0,.85) 100%);z-index:1;pointer-events:none}
.mono{font-family:'JetBrains Mono',monospace}
.neon{color:var(--neon);text-shadow:0 0 12px var(--neon),0 0 28px var(--neon-glow)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}.pulse{animation:pulse 1.6s ease-in-out infinite}
.clock-wrap{position:relative;width:380px;height:380px;max-width:84vw;max-height:84vw;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--neon) var(--pct,0%), rgba(255,255,255,.12) 0%);-webkit-mask:radial-gradient(circle, transparent 68%, black 70%);mask:radial-gradient(circle, transparent 68%, black 70%)}
.clock{position:relative;width:86%;height:86%;border-radius:50%;background:radial-gradient(circle at 32% 28%,#232323 0%,#121212 40%,#080808 70%,#000 100%);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.15),0 20px 80px rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.glass{background:rgba(18,18,18,.82);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1)}
.wall-thumb{width:100%;height:68px;border-radius:12px;object-fit:cover;border:2px solid transparent;cursor:pointer;transition:all.2s}
.wall-thumb.active{border-color:var(--neon);transform:scale(1.05);box-shadow:0 0 16px var(--neon-glow)}
</style>
</head>
<body>

<div id="bgLayer" class="bg-layer" style="background-image:url('https://images.unsplash.com/photo-1517705008128-361805f42e86?w=1200')"></div>
<div class="bg-overlay"></div>

<div class="z-10 w-full max-w-[980px] px-5 pt-6 flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-white text-black font-bold flex items-center justify-center text-xs">C$</div><div><div class="text-white font-bold text-sm tracking-wide">CLOCK-MONEY</div><div class="text-white/50 text-[10px] tracking-[0.2em]">WALLPAPERS</div></div></div>
<div class="flex gap-2"><button onclick="toggleCustom()" class="glass px-4 py-2 rounded-full text-xs text-white">🎨 Personalizar</button><div id="totalGeral" class="glass px-4 py-2 rounded-full text-xs mono text-white/70 hidden md:block"></div></div>
</div>

<div id="abas" class="z-10 flex gap-2 mt-6 overflow-auto max-w-full px-5"></div>

<div class="z-10 flex-1 flex flex-col lg:flex-row items-center justify-center gap-10 w-full max-w-[980px] px-5 py-8">
  <div class="clock-wrap">
    <div id="ring" class="ring"></div>
    <div class="clock text-center"><div class="text-[9px] tracking-[0.5em] text-white/30 font-bold">HOJE</div><div id="valorGrande" class="mono font-extrabold neon pulse mt-1" style="font-size:46px">R$ 1,81</div><div class="mt-2 flex gap-2 text-[10px] mono text-white/50"><span id="horaAgora">10:52:56</span><span>•</span><span id="segTxt">R$ 0,0000/s</span></div></div>
  </div>
  <div class="w-full max-w-[380px] space-y-3">
    <div class="glass rounded-[20px] p-5"><div class="text-[10px] tracking-[0.22em] text-white/40 font-bold">ACUMULADO DE HOJE</div><div id="acumuladoHoje" class="mono text-[30px] font-extrabold neon mt-1">R$ 1,81</div><div id="sub" class="mono text-[11px] text-white/50 mt-1"></div>
      <div class="grid grid-cols-3 gap-2 mt-5">
        <div class="rounded-xl p-3 bg-white/[0.06] border border-white/10"><div class="text-[9px] text-white/40">HOJE</div><div id="cardHoje" class="mono text-sm font-bold text-white mt-1">R$ 1.81</div></div>
        <div class="rounded-xl p-3 bg-white/[0.06] border border-white/10"><div class="text-[9px] text-white/40">MÊS</div><div id="cardMes" class="mono text-sm font-bold text-white mt-1">R$ 120</div></div>
        <div class="rounded-xl p-3 bg-white/[0.06] border border-white/10"><div class="text-[9px] text-white/40">ANO</div><div id="cardAno" class="mono text-sm font-bold text-white mt-1">R$ 1458</div></div>
      </div>
    </div>
    <div class="flex gap-2"><button onclick="toggleModal()" class="flex-1 glass py-3.5 rounded-full text-white text-[13px] font-bold">◧ Editar carteira</button><button onclick="togglePause()" id="btnPause" class="glass w-12 h-12 rounded-full text-white">⏸</button><button onclick="resetHoje()" class="glass w-12 h-12 rounded-full text-white">↺</button></div>
  </div>
</div>

<!-- PAINEL PERSONALIZAÇÃO COM WALLPAPERS -->
<div id="customModal" class="fixed inset-0 z-[60] hidden"><div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="toggleCustom()"></div><div class="absolute top-0 right-0 h-full w-[380px] max-w-[90vw] bg-[#141414] border-l border-white/10 p-6 overflow-auto"><div class="flex justify-between items-center"><h2 class="font-bold text-white">🎨 Personalizar</h2><button onclick="toggleCustom()" class="text-white/40">✕</button></div>

<div class="mt-6"><div class="text-xs text-white/60 mb-3 font-bold tracking-widest">WALLPAPERS PREMIUM</div>
<div class="grid grid-cols-2 gap-3">
<div onclick="setWallpaper('https://images.unsplash.com/photo-1517705008128-361805f42e86?w=800',this)"><img src="https://images.unsplash.com/photo-1517705008128-361805f42e86?w=300" class="wall-thumb active"><div class="text-[11px] text-white/60 mt-1">🛏️ Quarto Aconchegante</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1585328001265-387d378b2e9c?w=800',this)"><img src="https://images.unsplash.com/photo-1585328001265-387d378b2e9c?w=300" class="wall-thumb"><div class="text-[11px] text-white/60 mt-1">🌿 Jardim Zen</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=800',this)"><img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=300" class="wall-thumb"><div class="text-[11px] text-white/60 mt-1">🏔️ Lago com Lua</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=800',this)"><img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=300" class="wall-thumb"><div class="text-[11px] text-white/60 mt-1">🏎️ Garagem Esportiva</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800',this)"><img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=300" class="wall-thumb"><div class="text-[11px] text-white/60 mt-1">🏡 Mansão Moderna</div></div>
<div onclick="setWallpaper('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800',this)"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=300" class="wall-thumb"><div class="text-[11px] text-white/60 mt-1">🌌 Noite Estrelada</div></div>
</div>
<button onclick="setWallpaper('',this)" class="w-full mt-3 py-2.5 rounded-xl bg-zinc-800 text-white text-xs">🌑 Sem fundo (Dark puro)</button>
</div>

<div class="mt-8"><div class="text-xs text-white/60 mb-3 font-bold tracking-widest">COR DO NEON</div><div class="flex gap-2"><div class="w-8 h-8 rounded-full bg-[#9effbf] border-2 border-white/20 cursor-pointer" onclick="setNeon('#9effbf','rgba(158,255,191,.55)',this)"></div><div class="w-8 h-8 rounded-full bg-[#60a5fa] border-2 border-white/20 cursor-pointer" onclick="setNeon('#60a5fa','rgba(96,165,250,.55)',this)"></div><div class="w-8 h-8 rounded-full bg-white border-2 border-white/20 cursor-pointer" onclick="setNeon('#ffffff','rgba(255,255,255,.4)',this)"></div><div class="w-8 h-8 rounded-full bg-[#f472b6] border-2 border-white/20 cursor-pointer" onclick="setNeon('#f472b6','rgba(244,114,182,.55)',this)"></div><div class="w-8 h-8 rounded-full bg-[#fbbf24] border-2 border-white/20 cursor-pointer" onclick="setNeon('#fbbf24','rgba(251,191,36,.55)',this)"></div></div></div>

<div class="mt-8"><div class="text-xs text-white/60 mb-3 font-bold tracking-widest">TAMANHO</div><input id="sizeSlider" type="range" min="32" max="68" value="46" class="w-full accent-white" oninput="setSize(this.value)"></div>

</div></div>

<!-- MODAL CARTEIRA -->
<div id="modal" class="fixed inset-0 z-50 translate-y-full transition-transform duration-500"><div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="toggleModal()"></div><div class="absolute bottom-0 left-0 right-0 bg-[#141414] rounded-t-[28px] max-h-[88dvh] overflow-auto border-t border-white/10 p-6"><div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-5"></div><div class="flex justify-between items-center text-white"><h2 class="font-bold">Carteiras</h2><button onclick="novaAba()" class="text-xs bg-white text-black px-3 py-1.5 rounded-full font-bold">+ Nova</button></div><div id="abasModal" class="flex gap-2 mt-4 overflow-auto"></div><div class="flex gap-2 mt-5"><button onclick="setTipo('B3')" id="b1" class="flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm">B3</button><button onclick="setTipo('FIXA')" id="b2" class="flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm">CDI</button></div><div id="fB3" class="mt-5"><input id="busca" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white placeholder-white/30 outline-none" placeholder="MXRF11..." oninput="buscar(this.value)" onfocus="buscar(this.value)"><div id="sugestoes" class="mt-2 rounded-xl overflow-hidden hidden border border-white/10 bg-[#1e1e1e]"></div><div id="infoAtivo" class="hidden mt-3 text-white text-sm bg-white/5 p-3 rounded-xl"></div><div class="grid grid-cols-2 gap-3 mt-4"><input id="qtd" type="number" class="w-full bg-black border border-white/15 rounded-xl p-3 text-white font-bold" placeholder="QTD" oninput="onQtdChange()"><input id="total" type="number" class="w-full bg-black border border-white/15 rounded-xl p-3 text-emerald-400 font-bold" placeholder="TOTAL R$" oninput="onTotalChange()"></div></div><div id="fFIXA" class="hidden mt-5 space-y-3"><select id="tipoFixa" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white" onchange="trocaFixa()"><option value="12.15">100% CDI • 12,15%</option><option value="14.58">120% CDI • 14,58%</option><option value="7.5">Poupança • 7,5%</option></select><input id="nomeFixa" class="w-full bg-black border border-white/15 rounded-xl p-4 text-white" placeholder="Nome: caixinha da nubank"><div class="grid grid-cols-2 gap-3"><input id="taxaFixa" type="number" class="bg-black border border-white/15 rounded-xl p-4 text-white mono" placeholder="% a.a."><input id="valorFixa" type="number" class="bg-black border border-white/15 rounded-xl p-4 text-white mono" placeholder="Valor R$"></div></div><div id="preview" class="hidden mt-4 p-3 rounded-xl bg-white/5 text-white mono text-xs"></div><button onclick="adicionar()" class="w-full bg-white text-black font-bold rounded-2xl p-4 mt-4">+ Adicionar</button><div id="lista" class="mt-6 space-y-2 pb-10"></div></div></div>

<script>
const POPULARES=["MXRF11","HGLG11","KNRI11","XPLG11","BCFF11","PETR4","VALE3","WEGE3","ITUB4"];
let carteiras=JSON.parse(localStorage.getItem('carteirasV24')||'null')||[{id:1,nome:'FIIs',ativos:[]},{id:2,nome:'Ações',ativos:[]},{id:3,nome:'Reserva CDI',ativos:[]},{id:4,nome:'caixinha da nubank',ativos:[{id:1,ticker:'caixinha da nubank',preco:5000,qtd:1,dy:0.1215,rendDia:1.66}]}];
let ativaId=parseInt(localStorage.getItem('ativaId')||'4');let sel=null,trava=false,inicio=new Date();inicio.setHours(0,0,0,0);let pausado=false;window.tipoAtivo='B3';
let prefs=JSON.parse(localStorage.getItem('prefsV6')||'{"neon":"#9effbf","glow":"rgba(158,255,191,.55)","size":46,"wall":"https://images.unsplash.com/photo-1517705008128-361805f42e86?w=1200"}');
function applyPrefs(){document.documentElement.style.setProperty('--neon',prefs.neon);document.documentElement.style.setProperty('--neon-glow',prefs.glow);document.getElementById('valorGrande').style.fontSize=prefs.size+'px';const sl=document.getElementById('sizeSlider');if(sl)sl.value=prefs.size;const bg=document.getElementById('bgLayer');bg.style.backgroundImage=prefs.wall?`url('${prefs.wall}')`:'none';bg.style.opacity=prefs.wall?'1':'0';localStorage.setItem('prefsV6',JSON.stringify(prefs));}
function setNeon(c,g){prefs.neon=c;prefs.glow=g;applyPrefs();}
function setWallpaper(url,el){prefs.wall=url;if(el){document.querySelectorAll('.wall-thumb').forEach(t=>t.classList.remove('active'));if(el.querySelector)el.querySelector('.wall-thumb')?.classList.add('active');else if(el.classList)el.classList.add('active');}applyPrefs();}
function setSize(s){prefs.size=s;applyPrefs();}
function toggleCustom(){document.getElementById('customModal').classList.toggle('hidden');}
function save(){localStorage.setItem('carteirasV24',JSON.stringify(carteiras));localStorage.setItem('ativaId',ativaId);}
function renderAbas(){const h=carteiras.map(c=>`<button onclick="trocaAba(${c.id})" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap ${c.id===ativaId?'bg-white text-black':'glass text-white/60'}">${c.nome}</button>`).join('');document.getElementById('abas').innerHTML=h;document.getElementById('abasModal').innerHTML=h;const tg=carteiras.reduce((a,c)=>a+c.ativos.reduce((x,y)=>x+y.rendDia,0),0);document.getElementById('totalGeral').innerText=`TOTAL R$ ${(tg*30).toFixed(0)}/mês`;}
function trocaAba(id){ativaId=id;save();renderAbas();renderLista();}function novaAba(){const n=prompt('Nome:');if(!n) return;const id=Date.now();carteiras.push({id,nome:n,ativos:[]});ativaId=id;save();renderAbas();renderLista();}
function setTipo(t){window.tipoAtivo=t;document.getElementById('fB3').classList.toggle('hidden',t!=='B3');document.getElementById('fFIXA').classList.toggle('hidden',t!=='FIXA');document.getElementById('b1').className=t==='B3'?'flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm':'flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm';document.getElementById('b2').className=t==='FIXA'?'flex-1 py-3 rounded-xl bg-white text-black font-bold text-sm':'flex-1 py-3 rounded-xl bg-zinc-800 text-white text-sm';}
function trocaFixa(){document.getElementById('taxaFixa').value=document.getElementById('tipoFixa').value;}
function buscar(q){const d=document.getElementById('sugestoes');const termo=(q||'').toUpperCase();let lista=POPULARES.filter(t=>t.includes(termo)).slice(0,8);if(termo.length===0)lista=POPULARES.slice(0,6);if(lista.length===0)lista=[termo];d.innerHTML=lista.map(t=>`<div class="px-4 py-3.5 text-white font-semibold text-sm hover:bg-white/10 cursor-pointer border-b border-white/5" onclick="selecionar('${t}')">${t}</div>`).join('');d.classList.remove('hidden');}
async function selecionar(t){document.getElementById('busca').value=t;document.getElementById('sugestoes').classList.add('hidden');const prev=document.getElementById('preview');prev.classList.remove('hidden');prev.innerHTML=`Buscando ${t}...`;let preco=t.includes('11')?10.25:42.6;let dy=t.includes('11')?0.12:0.06;try{const r=await fetch(`https://brapi.dev/api/quote/${t}?token=qtZQumqzTgLyLYyMd5Ph9n&dividends=true`);const j=await r.json();const dados=j.results?.[0];if(dados?.regularMarketPrice)preco=dados.regularMarketPrice;if(dados?.dividendsData?.cashDividends?.length){const data12m=new Date();data12m.setFullYear(data12m.getFullYear()-1);const soma=dados.dividendsData.cashDividends.filter(x=>new Date(x.paymentDate)>data12m).reduce((a,b)=>a+(b.rate||0),0);if(soma>0)dy=soma/preco;}}catch(e){}sel={ticker:t,preco,dy,rendDia:preco*dy/365};document.getElementById('infoAtivo').classList.remove('hidden');document.getElementById('infoAtivo').innerText=`${t} • R$ ${preco.toFixed(2)} • ${(dy*100).toFixed(2)}% a.a.`;prev.innerHTML=`${t} • R$ ${preco.toFixed(2)} • ${(dy*100).toFixed(2)}%`;}
function onQtdChange(){if(trava||!sel) return;trava=true;const qtd=parseFloat(document.getElementById('qtd').value)||0;document.getElementById('total').value=qtd>0?(qtd*sel.preco).toFixed(2):'';trava=false;updPrev();}
function onTotalChange(){if(trava||!sel) return;trava=true;const total=parseFloat(document.getElementById('total').value)||0;document.getElementById('qtd').value=total>0?Math.floor(total/sel.preco):'';trava=false;updPrev();}
function updPrev(){if(!sel) return;const qtd=parseInt(document.getElementById('qtd').value)||0;const p=document.getElementById('preview');if(qtd>0){p.classList.remove('hidden');p.innerHTML=`${qtd} cotas = R$ ${(qtd*sel.preco).toFixed(2)} • R$ ${((sel.preco*sel.dy/365)*qtd).toFixed(2)}/dia`;}}
function adicionar(){const cart=carteiras.find(c=>c.id===ativaId);if((window.tipoAtivo||'B3')==='B3'){const qtd=parseInt(document.getElementById('qtd').value)||0;if(!sel||qtd<=0)return alert('QTD');cart.ativos.push({id:Date.now(),ticker:sel.ticker,qtd,preco:sel.preco,dy:sel.dy,rendDia:(sel.preco*sel.dy/365)*qtd});}else{const taxa=parseFloat(document.getElementById('taxaFixa').value)||0;const valor=parseFloat(document.getElementById('valorFixa').value)||0;const nome=document.getElementById('nomeFixa').value||'Reserva';if(!valor||!taxa)return;cart.ativos.push({id:Date.now(),ticker:nome,preco:valor,qtd:1,dy:taxa/100,rendDia:valor*(taxa/100)/365});}save();renderLista();document.getElementById('qtd').value='';document.getElementById('total').value='';document.getElementById('valorFixa').value='';document.getElementById('preview').classList.add('hidden');}
function removerAtivo(id){const c=carteiras.find(x=>x.id===ativaId);c.ativos=c.ativos.filter(a=>a.id!==id);save();renderLista();}
function renderLista(){const c=carteiras.find(x=>x.id===ativaId);const totalDia=c?c.ativos.reduce((a,b)=>a+b.rendDia,0):0;window.totalDia=totalDia;document.getElementById('lista').innerHTML=c?c.ativos.map(a=>`<div class="bg-white/[0.06] rounded-xl p-3 flex justify-between text-sm text-white"><div><b>${a.ticker}</b> ${a.qtd>1?`x${a.qtd}`:''} <span style="color:var(--neon)">${(a.dy*100).toFixed(2)}%</span><div class="mono text-[10px] text-white/40">R$ ${(a.rendDia/86400).toFixed(7)}/s</div></div><button onclick="removerAtivo(${a.id})" class="text-white/40">✕</button></div>`).join(''):'<div class="text-xs text-white/30 text-center py-6">Carteira vazia</div>';renderAbas();}
function toggleModal(){document.getElementById('modal').classList.toggle('translate-y-full');}
function togglePause(){pausado=!pausado;document.getElementById('btnPause').innerText=pausado?'▶':'⏸';}
function resetHoje(){inicio=new Date();inicio.setHours(0,0,0,0);}
setInterval(()=>{if(pausado) return;const agora=new Date();const seg=(agora-inicio)/1000;const ps=(window.totalDia||0)/86400;const acum=seg*ps;const fmt='R$ '+acum.toFixed(2).replace('.',',');document.getElementById('valorGrande').innerText=fmt;document.getElementById('acumuladoHoje').innerText=fmt;document.getElementById('cardHoje').innerText='R$ '+acum.toFixed(2);document.getElementById('cardMes').innerText='R$ '+((window.totalDia||0)*30).toFixed(0);document.getElementById('cardAno').innerText='R$ '+((window.totalDia||0)*365).toFixed(0);document.getElementById('segTxt').innerText=`R$ ${ps.toFixed(4).replace('.',',')}/s`;document.getElementById('sub').innerText=`${carteiras.find(c=>c.id===ativaId)?.ativos.length||0} ativo(s) • R$ ${ps.toFixed(4).replace('.',',')}/s • ${carteiras.find(c=>c.id===ativaId)?.nome}`;document.getElementById('horaAgora').innerText=agora.toLocaleTimeString('pt-BR');const pctDia=(agora.getHours()*3600+agora.getMinutes()*60+agora.getSeconds())/86400;document.getElementById('ring').style.setProperty('--pct',(pctDia*100)+'%');},120);
applyPrefs();renderAbas();renderLista();
</script>
</body>
</html>

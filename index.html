<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Money</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff66">
<link rel="apple-touch-icon" href="icon-512.jpg">
<style>
  :root{--bg:#0a0a1a;--card:#151530;--accent:#00ff66;--text:#fff;--muted:#8b8bb5}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;padding:16px;display:flex;flex-direction:column;align-items:center}
 .header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;margin:10px 0 20px}
 .logo{font-size:1.7em;font-weight:900;color:var(--accent)}
 .card{background:var(--card);border:1.5px solid var(--accent);border-radius:22px;padding:22px;width:100%;max-width:480px;margin-bottom:16px}
  label{font-size:.85em;color:var(--muted);margin-top:12px;display:block}
  input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #2a2a4a;background:#0f0f25;color:#fff;font-size:1.05em;margin-top:6px;outline:none}
  input:focus{border-color:var(--accent)}
 .timer{font-size:3em;font-weight:800;text-align:center;margin:18px 0 5px;color:var(--accent)}
 .money{font-size:2em;font-weight:800;text-align:center;margin-bottom:10px}
 .row{display:flex;gap:10px;margin-top:14px}
 .btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:800;cursor:pointer}
 .btn-start{background:var(--accent);color:#000}
 .btn-pause{background:#fff;color:#000}
 .btn-reset{background:transparent;border:1px solid #ff3b5c;color:#ff3b5c}
 .stats{display:flex;gap:10px;margin-top:18px}
 .stat{flex:1;background:#0f0f25;border-radius:14px;padding:12px;text-align:center;border:1px solid #22224a}
 .stat b{display:block;color:var(--accent)}
 .stat span{font-size:.75em;color:var(--muted)}
 .sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .sim-result{background:#0f0f25;border-radius:14px;padding:14px;margin-top:12px;border:1px dashed var(--accent)}
 .sim-result b{color:var(--accent);font-size:1.3em}
</style>
</head>
<body>
  <div class="header">
    <div class="logo">⏰ Clock Money</div>
    <button onclick="document.documentElement.style.setProperty('--accent',['#00ff66','#00d4ff','#ff00ff','#ffae00'][Math.floor(Math.random()*4)])" style="background:#151530;border:1px solid var(--accent);color:var(--accent);padding:8px 14px;border-radius:20px">🎨</button>
  </div>

  <div class="card">
    <label>Valor por hora (R$)</label>
    <input id="rate" type="number" value="50">
    <div class="timer" id="timer">00:00:00</div>
    <div class="money" id="result">R$ 0,00</div>
    <div class="row">
      <button class="btn btn-start" id="startBtn" onclick="toggle()">▶ Iniciar</button>
      <button class="btn btn-reset" onclick="reset()">Zerar</button>
    </div>
  </div>

  <div class="card">
    <h3 style="color:var(--accent);margin-bottom:10px">📈 Simulador - Juntar por 14 anos</h3>
    <div class="sim-grid">
      <div><label>Por mês (R$)</label><input id="simMonth" type="number" value="50"></div>
      <div><label>Anos</label><input id="simYears" type="number" value="14"></div>
    </div>
    <label>Rendimento</label>
    <select id="simRate">
      <option value="0">Sem rendimento (guardado)</option>
      <option value="0.5">Poupança 0,5% a.m.</option>
      <option value="0.85" selected>Caixinha 100% CDI 0,85% a.m.</option>
      <option value="1">1% a.m.</option>
    </select>
    <div class="sim-result">
      <div>Você terá: <b id="simTotal">R$ 0,00</b></div>
      <div style="font-size:.8em;color:var(--muted);margin-top:4px"><span id="simDetail">0 depósitos</span> • Juros: <span id="simJuros">R$ 0,00</span></div>
    </div>
  </div>

<script>
let sec=0, interval=null, running=false;
const rateEl=document.getElementById('rate'), timerEl=document.getElementById('timer'), resultEl=document.getElementById('result');
rateEl.value=localStorage.getItem('cm_rate')||50;
function fmt(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function calc(){let r=parseFloat(rateEl.value)||0; let v=r*(sec/3600); resultEl.innerText=money(v); return v;}
function toggle(){if(!running){running=true;document.getElementById('startBtn').innerText='⏸ Pausar';document.getElementById('startBtn').className='btn btn-pause';interval=setInterval(()=>{sec++;timerEl.innerText=fmt(sec);calc();},1000);}else{running=false;document.getElementById('startBtn').innerText='▶ Continuar';document.getElementById('startBtn').className='btn btn-start';clearInterval(interval);}}
function reset(){clearInterval(interval);running=false;sec=0;timerEl.innerText='00:00:00';resultEl.innerText='R$ 0,00';document.getElementById('startBtn').innerText='▶ Iniciar';document.getElementById('startBtn').className='btn btn-start';}
rateEl.addEventListener('input',()=>{localStorage.setItem('cm_rate',rateEl.value);calc();});

// SIMULADOR
function calcSim(){
  let p=parseFloat(document.getElementById('simMonth').value)||0;
  let years=parseFloat(document.getElementById('simYears').value)||14;
  let taxa=parseFloat(document.getElementById('simRate').value)||0;
  let n=years*12;
  let total, juros=0;
  if(taxa===0){ total=p*n; }
  else { let i=taxa/100; total=p*(((Math.pow(1+i,n)-1)/i)); juros=total-(p*n); }
  document.getElementById('simTotal').innerText=money(total);
  document.getElementById('simDetail').innerText=n+' depósitos de '+money(p);
  document.getElementById('simJuros').innerText=money(juros);
}
document.getElementById('simMonth').addEventListener('input',calcSim);
document.getElementById('simYears').addEventListener('input',calcSim);
document.getElementById('simRate').addEventListener('change',calcSim);
calcSim();

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Money</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff66">
<link rel="apple-touch-icon" href="icon-512.jpg">
<style>
  :root{--bg:#0a0a1a;--card:#151530;--accent:#00ff66;--text:#fff;--muted:#8b8bb5}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh;padding:16px;display:flex;flex-direction:column;align-items:center}
 .header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;margin:10px 0 20px}
 .logo{font-size:1.8em;font-weight:900;color:var(--accent);text-shadow:0 0 15px var(--accent)}
 .theme-btn{background:var(--card);border:1px solid var(--accent);color:var(--accent);padding:8px 14px;border-radius:20px;cursor:pointer}
 .card{background:var(--card);border:1.5px solid var(--accent);border-radius:22px;padding:22px;width:100%;max-width:480px;box-shadow:0 0 30px rgba(0,255,102,0.15)}
  label{font-size:.85em;color:var(--muted);margin-top:12px;display:block}
  input{width:100%;padding:14px;border-radius:12px;border:none;background:#0f0f25;color:#fff;font-size:1.05em;margin-top:6px;outline:none;border:1px solid #2a2a4a}
  input:focus{border-color:var(--accent)}
 .timer{font-size:3.2em;font-weight:800;text-align:center;margin:18px 0 5px;color:var(--accent);font-variant-numeric:tabular-nums}
 .money{font-size:2.2em;font-weight:800;text-align:center;color:#fff;margin-bottom:10px}
 .row{display:flex;gap:10px;margin-top:14px}
 .btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:1em;cursor:pointer;transition:.2s}
 .btn-start{background:var(--accent);color:#000}
 .btn-pause{background:#fff;color:#000}
 .btn-reset{background:transparent;border:1px solid #ff3b5c;color:#ff3b5c}
 .stats{display:flex;gap:10px;margin-top:18px}
 .stat{flex:1;background:#0f0f25;border-radius:14px;padding:12px;text-align:center;border:1px solid #22224a}
 .stat b{display:block;font-size:1.2em;color:var(--accent)}
 .stat span{font-size:.75em;color:var(--muted)}
  #installBtn{display:none;width:100%;max-width:480px;margin-top:16px;background:#fff;color:#000}
 .history{width:100%;max-width:480px;margin-top:20px}
 .history h3{color:var(--muted);font-size:.9em;margin-bottom:8px}
 .h-item{background:var(--card);border:1px solid #22224a;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;margin-bottom:8px;font-size:.9em}
</style>
</head>
<body>
  <div class="header">
    <div class="logo">⏰ Clock Money</div>
    <button class="theme-btn" onclick="toggleTheme()">🎨 Tema</button>
  </div>

  <div class="card">
    <label>Valor por hora (R$)</label>
    <input id="rate" type="number" value="50" inputmode="decimal">

    <label>Tempo manual (horas) - opcional</label>
    <input id="hours" type="number" value="" placeholder="Ex: 1.5" step="0.1">

    <div class="timer" id="timer">00:00:00</div>
    <div class="money" id="result">R$ 0,00</div>

    <div class="row">
      <button class="btn btn-start" id="startBtn" onclick="toggle()">▶ Iniciar</button>
      <button class="btn btn-reset" onclick="reset()">⟲ Zerar</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="today">R$ 0,00</b><span>Hoje</span></div>
      <div class="stat"><b id="totalHours">0h</b><span>Tempo hoje</span></div>
      <div class="stat"><b id="sessions">0</b><span>Sessões</span></div>
    </div>
  </div>

  <button id="installBtn" class="btn">📲 Instalar App</button>

  <div class="history">
    <h3>Histórico de hoje</h3>
    <div id="historyList"></div>
  </div>

<script>
let sec=0, interval=null, running=false;
const rateEl=document.getElementById('rate'), hoursEl=document.getElementById('hours');
const timerEl=document.getElementById('timer'), resultEl=document.getElementById('result');
const todayEl=document.getElementById('today'), tHoursEl=document.getElementById('totalHours'), sessEl=document.getElementById('sessions');

rateEl.value=localStorage.getItem('cm_rate')||50;
let history=JSON.parse(localStorage.getItem('cm_hist')||'[]');

function fmt(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function calc(){
  let r=parseFloat(rateEl.value)||0;
  let hMan=parseFloat(hoursEl.value)||0;
  let v = hMan>0? r*hMan : r*(sec/3600);
  resultEl.innerText=money(v);
  return v;
}
function toggle(){
  if(!running){
    running=true;
    document.getElementById('startBtn').innerText='⏸ Pausar'; document.getElementById('startBtn').className='btn btn-pause';
    interval=setInterval(()=>{sec++; timerEl.innerText=fmt(sec); calc();},1000);
  }else{
    running=false;
    document.getElementById('startBtn').innerText='▶ Continuar'; document.getElementById('startBtn').className='btn btn-start';
    clearInterval(interval);
  }
}
function reset(){
  if(sec>0||(parseFloat(hoursEl.value)||0)>0){
    let v=calc();
    if(v>0){ history.unshift({time:new Date().toLocaleTimeString(), secs:sec, hours:parseFloat(hoursEl.value)||sec/3600, value:v}); localStorage.setItem('cm_hist',JSON.stringify(history)); renderHist();}
  }
  clearInterval(interval); running=false; sec=0; hoursEl.value=''; timerEl.innerText='00:00:00'; resultEl.innerText='R$ 0,00';
  document.getElementById('startBtn').innerText='▶ Iniciar'; document.getElementById('startBtn').className='btn btn-start';
}
function renderHist(){
  let total=0, tSec=0;
  history.forEach(h=>{total+=h.value; tSec+=h.secs});
  todayEl.innerText=money(total); tHoursEl.innerText=(tSec/3600).toFixed(1)+'h'; sessEl.innerText=history.length;
  document.getElementById('historyList').innerHTML=history.map(h=>`<div class="h-item"><span>${h.time} • ${h.hours.toFixed(2)}h</span><b>${money(h.value)}</b></div>`).join('') || '<div style="color:#555;font-size:.85em">Nenhuma sessão hoje</div>';
}
rateEl.addEventListener('input',()=>{localStorage.setItem('cm_rate',rateEl.value); calc();});
hoursEl.addEventListener('input',calc);
function toggleTheme(){
  const themes=['#00ff66','#00d4ff','#ff00ff','#ffae00'];
  let cur=localStorage.getItem('cm_color')||0; cur=(parseInt(cur)+1)%themes.length;
  document.documentElement.style.setProperty('--accent',themes[cur]); localStorage.setItem('cm_color',cur);
}
renderHist(); calc();

let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
document.getElementById('installBtn').addEventListener('click',()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>deferredPrompt=null)}});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
